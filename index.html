<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudiar</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #a78bfa;
            --primary-light: #c4b5fd;
            --primary-dark: #7c3aed;
            --bg: #0f0f14;
            --card: #1a1a24;
            --card-hover: #22222e;
            --text: #e8e6f0;
            --text-light: #9590a8;
            --border: #2a2a38;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        header {
            background: #1a1a24;
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .config-btn {
            background: var(--border);
            border: 1px solid #3a3a4a;
            color: var(--text);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .config-btn:hover { background: #3a3a4a; }
        .container { max-width: 900px; margin: 0 auto; padding: 1.5rem; }

        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 5rem 2rem;
            text-align: center;
            background: var(--card);
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 1.5rem;
        }
        .upload-zone:hover, .upload-zone.dragover { border-color: var(--primary); background: var(--card-hover); }
        .upload-zone .icon { font-size: 3rem; margin-bottom: 1rem; }
        .upload-zone h3 { color: var(--primary-light); margin-bottom: 0.5rem; }
        .upload-zone p { color: var(--text-light); font-size: 0.9rem; }
        .upload-zone input { display: none; }

        .tabs {
            display: flex; gap: 0.4rem; margin-bottom: 1rem;
            background: var(--card); padding: 0.3rem; border-radius: 12px; border: 1px solid var(--border);
        }
        .tab {
            flex: 1; padding: 0.7rem 1rem; border: none; background: transparent;
            border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 600;
            color: var(--text-light); transition: all 0.2s;
        }
        .tab.active { background: var(--primary-dark); color: white; }
        .tab:hover:not(.active) { background: var(--card-hover); }
        .panel { display: none; }
        .panel.active { display: block; }

        .pdf-viewer {
            background: var(--card); border-radius: 16px; border: 1px solid var(--border);
            overflow: hidden; margin-bottom: 1.5rem;
        }
        .pdf-controls {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.75rem 1rem; background: #12121a; border-bottom: 1px solid var(--border);
            gap: 0.5rem; flex-wrap: wrap;
        }
        .pdf-controls button {
            background: var(--primary-dark); color: white; border: none;
            padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer;
            font-size: 0.85rem; font-weight: 600;
        }
        .pdf-controls button:hover { background: var(--primary); }
        .pdf-controls button:disabled { opacity: 0.3; cursor: not-allowed; }
        .pdf-controls .page-jump {
            display: flex; align-items: center; gap: 0.4rem;
            font-size: 0.85rem; color: var(--text-light);
        }
        .pdf-controls .page-jump input {
            width: 50px; padding: 0.35rem; border: 1px solid var(--border);
            border-radius: 6px; text-align: center; font-size: 0.85rem;
            background: var(--bg); color: var(--text);
        }

        #pdf-container { padding: 1rem; text-align: center; background: #0a0a0f; }
        #pdf-container canvas {
            max-width: 100%; box-shadow: 0 2px 16px rgba(0,0,0,0.5); border-radius: 4px;
        }

        .extracted-text {
            padding: 1.5rem; line-height: 2; font-size: 0.95rem;
            user-select: text; cursor: text;
            border-top: 1px solid var(--border); background: #12121a;
        }
        .extracted-text .t-heading {
            color: var(--primary-light); font-size: 1.1rem; font-weight: 700;
            margin: 1.5rem 0 0.5rem;
        }
        .extracted-text .t-heading:first-child { margin-top: 0; }
        .extracted-text .t-sub {
            color: var(--primary); font-size: 1rem; font-weight: 600;
            margin: 1rem 0 0.4rem;
        }
        .extracted-text .t-para {
            margin-bottom: 1rem; padding: 0.3rem 0.5rem; border-radius: 4px;
        }
        .extracted-text .t-para:hover { background: var(--card-hover); }

        .voice-controls {
            display: flex; gap: 0.5rem; padding: 0.75rem 1rem;
            background: #12121a; border-top: 1px solid var(--border);
            flex-wrap: wrap; align-items: center;
        }
        .voice-btn {
            background: var(--success); color: #0f0f14; border: none;
            padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer;
            font-weight: 600; font-size: 0.85rem; display: flex; align-items: center; gap: 0.3rem;
        }
        .voice-btn:hover { filter: brightness(1.15); }
        .voice-btn.stop { background: var(--danger); color: white; }
        .voice-btn.pause { background: var(--warning); color: #0f0f14; }
        .voice-settings {
            display: flex; align-items: center; gap: 0.5rem;
            margin-left: auto; flex-wrap: wrap;
        }
        .voice-settings label { font-size: 0.8rem; color: var(--text-light); }
        .voice-settings select, .voice-settings input[type="range"] {
            font-size: 0.8rem; padding: 0.3rem; border: 1px solid var(--border);
            border-radius: 6px; background: var(--bg); color: var(--text);
        }

        .quiz-section {
            background: var(--card); border-radius: 16px;
            border: 1px solid var(--border); padding: 1.5rem;
        }
        .quiz-config {
            display: flex; gap: 0.75rem; margin-bottom: 1.5rem;
            flex-wrap: wrap; align-items: end;
        }
        .quiz-config .field { flex: 1; min-width: 110px; }
        .quiz-config label {
            display: block; font-size: 0.75rem; color: var(--text-light);
            margin-bottom: 0.3rem; font-weight: 600; text-transform: uppercase;
        }
        .quiz-config input, .quiz-config select {
            width: 100%; padding: 0.6rem; border: 1px solid var(--border);
            border-radius: 8px; font-size: 0.9rem; background: var(--bg); color: var(--text);
        }
        .quiz-config input:focus, .quiz-config select:focus { outline: none; border-color: var(--primary); }
        .generate-btn {
            background: var(--primary-dark); color: white; border: none;
            padding: 0.6rem 1.5rem; border-radius: 8px; cursor: pointer;
            font-weight: 700; font-size: 0.9rem; white-space: nowrap;
        }
        .generate-btn:hover { background: var(--primary); }

        .loading { display: none; text-align: center; padding: 3rem; }
        .loading.show { display: block; }
        .spinner {
            width: 40px; height: 40px; border: 3px solid var(--border);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .question-card {
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem;
        }
        .question-card:hover { border-color: var(--primary-dark); }
        .question-card .q-header {
            display: flex; align-items: flex-start; gap: 0.6rem; margin-bottom: 0.75rem;
        }
        .question-card .q-number {
            background: var(--primary-dark); color: white;
            min-width: 28px; height: 28px; border-radius: 50%;
            text-align: center; line-height: 28px; font-size: 0.8rem;
            font-weight: 700; flex-shrink: 0;
        }
        .question-card .q-text { font-weight: 600; font-size: 0.95rem; line-height: 1.5; flex: 1; }
        .question-card .listen-btn {
            background: none; border: 1px solid var(--primary-dark);
            color: var(--primary-light); padding: 0.2rem 0.5rem; border-radius: 6px;
            cursor: pointer; font-size: 0.7rem; flex-shrink: 0;
        }
        .question-card .listen-btn:hover { background: var(--card-hover); }
        .question-card .options { margin-top: 0.5rem; }
        .question-card .option {
            display: flex; align-items: flex-start; gap: 0.6rem;
            padding: 0.65rem 0.8rem; border: 1px solid var(--border);
            border-radius: 8px; margin-bottom: 0.4rem; cursor: pointer;
            font-size: 0.9rem; line-height: 1.4; transition: all 0.2s;
        }
        .question-card .option:hover { background: var(--card-hover); border-color: var(--primary-dark); }
        .question-card .option.selected { background: rgba(124,58,237,0.15); border-color: var(--primary); }
        .question-card .option.correct { background: rgba(52,211,153,0.12); border-color: var(--success); color: var(--success); }
        .question-card .option.incorrect { background: rgba(248,113,113,0.12); border-color: var(--danger); color: var(--danger); }
        .question-card .option input { display: none; }
        .question-card .explanation {
            margin-top: 0.75rem; padding: 0.75rem;
            background: rgba(251,191,36,0.06); border: 1px solid rgba(251,191,36,0.2);
            border-radius: 8px; font-size: 0.85rem; color: var(--warning);
            line-height: 1.5; display: none;
        }
        .question-card .explanation.show { display: block; }

        .quiz-results {
            display: none; text-align: center; padding: 2.5rem;
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 12px; margin-top: 1rem;
        }
        .quiz-results .score { font-size: 3rem; font-weight: 800; color: var(--primary-light); }
        .quiz-results .score-label { font-size: 1rem; color: var(--text-light); margin-top: 0.5rem; }
        .check-btn {
            background: var(--success); color: #0f0f14; border: none;
            padding: 0.7rem 2rem; border-radius: 8px; cursor: pointer;
            font-weight: 700; font-size: 1rem; margin-top: 1.5rem;
        }
        .check-btn:hover { filter: brightness(1.1); }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.7);
            z-index: 200; align-items: center; justify-content: center; padding: 1rem;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 1.5rem; max-width: 420px; width: 100%;
        }
        .modal h3 { margin-bottom: 0.75rem; color: var(--primary-light); }
        .modal input {
            width: 100%; padding: 0.6rem; border: 1px solid var(--border);
            border-radius: 8px; font-size: 0.85rem; background: var(--bg); color: var(--text);
        }
        .modal .btn-row { display: flex; gap: 0.5rem; margin-top: 1rem; justify-content: flex-end; }
        .modal .btn-row button { padding: 0.5rem 1rem; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
        .modal .btn-row .save-btn { background: var(--primary-dark); color: white; }
        .modal .btn-row .cancel-btn { background: var(--border); color: var(--text); }

        .hidden { display: none !important; }
        .notification {
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
            background: var(--card); color: var(--text); padding: 0.6rem 1.2rem;
            border-radius: 10px; font-size: 0.8rem; border: 1px solid var(--border);
            z-index: 300; opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .notification.show { opacity: 1; }
        .api-status {
            font-size: 0.65rem; padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: 600;
        }
        .api-status.connected { background: rgba(52,211,153,0.15); color: var(--success); }
        .api-status.disconnected { background: rgba(248,113,113,0.15); color: var(--danger); }
        .header-left { display: flex; align-items: center; gap: 0.5rem; }

        @media (max-width: 640px) {
            .container { padding: 1rem; }
            .tabs { flex-direction: column; }
            .tab { font-size: 0.85rem; }
            .pdf-controls { flex-direction: column; align-items: stretch; }
            .quiz-config { flex-direction: column; }
            .quiz-config .field { min-width: 100%; }
            .voice-controls { flex-direction: column; align-items: stretch; }
            .voice-settings { margin-left: 0; justify-content: space-between; }
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    </style>
</head>
<body>
    <header>
        <div class="header-left"><span id="api-status" class="api-status disconnected">Sin API</span></div>
        <button class="config-btn" onclick="openConfig()">API Key</button>
    </header>

    <div class="container">
        <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()">
            <div class="icon">&#128211;</div>
            <h3>Sube tu PDF de estudio</h3>
            <p>Arrastra un archivo aqui o haz clic para seleccionar</p>
            <input type="file" id="file-input" accept=".pdf">
        </div>

        <div class="tabs hidden" id="main-tabs">
            <button class="tab active" data-tab="reader" onclick="switchTab('reader')">Lector de Voz</button>
            <button class="tab" data-tab="quiz" onclick="switchTab('quiz')">Generar Preguntas</button>
        </div>

        <div class="panel active" id="panel-reader">
            <div class="pdf-viewer">
                <div class="pdf-controls">
                    <button onclick="prevPage()" id="btn-prev">&#9664; Anterior</button>
                    <div class="page-jump">
                        <span>Pagina</span>
                        <input type="number" id="page-input" min="1" value="1" onchange="goToPage(this.value)">
                        <span>de <span id="total-pages">0</span></span>
                    </div>
                    <button onclick="nextPage()" id="btn-next">Siguiente &#9654;</button>
                </div>
                <div id="pdf-container"></div>
                <div id="extracted-text" class="hidden"></div>
                <div class="voice-controls">
                    <button class="voice-btn" onclick="speakSelected()" id="btn-speak">&#127908; Leer seleccion</button>
                    <button class="voice-btn pause" onclick="pauseSpeech()" id="btn-pause" disabled>&#9208; Pausar</button>
                    <button class="voice-btn stop" onclick="stopSpeech()" id="btn-stop" disabled>&#9632; Detener</button>
                    <div class="voice-settings">
                        <label>Velocidad:</label>
                        <input type="range" id="speech-rate" min="0.5" max="2" step="0.1" value="1" style="width:70px">
                        <label>Voz:</label>
                        <select id="voice-select"></select>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel" id="panel-quiz">
            <div class="quiz-section">
                <div class="quiz-config">
                    <div class="field">
                        <label>Desde pagina</label>
                        <input type="number" id="quiz-start" min="1" value="1">
                    </div>
                    <div class="field">
                        <label>Hasta pagina</label>
                        <input type="number" id="quiz-end" min="1" value="5">
                    </div>
                    <div class="field">
                        <label>Preguntas</label>
                        <input type="number" id="quiz-count" min="1" max="20" value="5">
                    </div>
                    <div class="field">
                        <label>Tipo</label>
                        <select id="quiz-type">
                            <option value="multiple">Multiple opcion</option>
                            <option value="verdadero">Verdadero / Falso</option>
                            <option value="mezcla">Mezcla</option>
                        </select>
                    </div>
                    <button class="generate-btn" onclick="generateQuiz()" id="btn-generate">Generar</button>
                </div>

                <div class="loading" id="quiz-loading">
                    <div class="spinner"></div>
                    <p style="color:var(--text-light);">Generando preguntas...</p>
                </div>

                <div id="quiz-area"></div>
                <div class="quiz-results" id="quiz-results">
                    <div class="score" id="quiz-score">0/0</div>
                    <div class="score-label">Preguntas correctas</div>
                    <button class="check-btn" onclick="resetQuiz()">Volver a intentar</button>
                </div>
                <div class="hidden" id="check-area" style="text-align:center;margin-top:1.5rem;">
                    <button class="check-btn" onclick="checkAnswers()">Verificar respuestas</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="config-modal">
        <div class="modal">
            <h3>Configuracion API</h3>
            <p style="font-size:0.8rem;color:var(--text-light);margin-bottom:0.75rem;">
                API key de Google Gemini.
                <br><a href="https://aistudio.google.com/apikey" target="_blank" style="color:var(--primary-light);">Obtener API key gratis</a>
            </p>
            <input type="password" id="api-key-input" placeholder="Pega tu API key aqui...">
            <div class="btn-row">
                <button class="cancel-btn" onclick="closeConfig()">Cancelar</button>
                <button class="save-btn" onclick="saveConfig()">Guardar</button>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfDoc = null;
        let currentPage = 1;
        let totalPages = 0;
        let allPageData = {};
        let apiKey = localStorage.getItem('gemini_api_key') || 'AIzaSyBIHCO5RhEv6VeoOZERi3ynvvet1hEuS5A';
        let quizQuestions = [];

        const uploadZone = document.getElementById('upload-zone');
        const fileInput = document.getElementById('file-input');
        const pdfContainer = document.getElementById('pdf-container');
        const extractedTextEl = document.getElementById('extracted-text');

        updateApiStatus();

        fileInput.addEventListener('change', e => { if (e.target.files[0]) loadPDF(e.target.files[0]); });
        uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
        uploadZone.addEventListener('drop', e => {
            e.preventDefault(); uploadZone.classList.remove('dragover');
            if (e.dataTransfer.files[0]) loadPDF(e.dataTransfer.files[0]);
        });

        async function loadPDF(file) {
            const arrayBuffer = await file.arrayBuffer();
            pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            totalPages = pdfDoc.numPages;
            currentPage = 1;

            document.getElementById('total-pages').textContent = totalPages;
            document.getElementById('page-input').max = totalPages;
            document.getElementById('quiz-end').max = totalPages;
            document.getElementById('quiz-end').value = Math.min(5, totalPages);
            document.getElementById('main-tabs').classList.remove('hidden');
            uploadZone.innerHTML = `<div class="icon">&#9989;</div><h3>${file.name}</h3><p>${totalPages} paginas listas</p>`;
            uploadZone.style.cursor = 'default';
            uploadZone.onclick = null;

            await extractAllPages();
            renderPage(currentPage);
            notify('PDF cargado');
        }

        async function extractAllPages() {
            allPageData = {};

            for (let i = 1; i <= totalPages; i++) {
                const page = await pdfDoc.getPage(i);
                const textContent = await page.getTextContent();
                const items = textContent.items;

                if (items.length === 0) {
                    allPageData[i] = { lines: [], paragraphs: [], cleanText: '' };
                    continue;
                }

                // Build lines by grouping items at similar Y positions
                const lineItems = [];
                let currentLineItems = [items[0]];

                for (let k = 1; k < items.length; k++) {
                    const prev = items[k - 1];
                    const curr = items[k];
                    const yDiff = Math.abs(curr.y - prev.y);

                    if (yDiff > 2) {
                        lineItems.push(currentLineItems);
                        currentLineItems = [curr];
                    } else {
                        currentLineItems.push(curr);
                    }
                }
                lineItems.push(currentLineItems);

                // Convert line items to line strings with Y positions
                const lines = lineItems.map(lineItemArr => {
                    let text = '';
                    const y = lineItemArr[0].y;
                    for (const item of lineItemArr) {
                        const prev = lineItemArr[lineItemArr.indexOf(item) - 1];
                        if (prev) {
                            const xGap = item.transform[4] - (prev.transform[4] + (prev.width || 0));
                            if (xGap > 5) text += ' ';
                            else if (xGap < -5) text += ' ';
                        }
                        text += item.str;
                    }
                    return { text: text.trim(), y };
                }).filter(l => l.text.length > 0);

                // Build paragraphs: detect breaks by Y gaps and line endings
                const paragraphs = [];
                let currentParagraph = [lines[0]];

                for (let j = 1; j < lines.length; j++) {
                    const prev = lines[j - 1];
                    const curr = lines[j];
                    const yGap = Math.abs(prev.y - curr.y);
                    const prevEndsWithPeriod = prev.text.endsWith('.') || prev.text.endsWith(':') || prev.text.endsWith(';');
                    const isShortLine = prev.text.length < 60 && !prevEndsWithPeriod;

                    const isBreak = yGap > 8 || (yGap > 3 && prevEndsWithPeriod) || (yGap > 3 && isShortLine);

                    if (isBreak) {
                        paragraphs.push(currentParagraph.map(l => l.text).join(' '));
                        currentParagraph = [curr];
                    } else {
                        currentParagraph.push(curr);
                    }
                }
                if (currentParagraph.length > 0) {
                    paragraphs.push(currentParagraph.map(l => l.text).join(' '));
                }

                // Merge very short paragraphs with next (likely fragments)
                const mergedParagraphs = [];
                for (let p = 0; p < paragraphs.length; p++) {
                    const text = paragraphs[p].trim();
                    if (text.length < 40 && mergedParagraphs.length > 0) {
                        mergedParagraphs[mergedParagraphs.length - 1] += ' ' + text;
                    } else {
                        mergedParagraphs.push(text);
                    }
                }

                allPageData[i] = {
                    lines: lines.map(l => l.text),
                    paragraphs: mergedParagraphs,
                    cleanText: mergedParagraphs.join('\n\n')
                };
            }
        }

        async function renderPage(num) {
            const page = await pdfDoc.getPage(num);
            const containerWidth = pdfContainer.clientWidth - 32;
            const unscaledViewport = page.getViewport({ scale: 1 });
            const scale = Math.min(containerWidth / unscaledViewport.width, 2);
            const viewport = page.getViewport({ scale });

            pdfContainer.innerHTML = '';
            const canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            pdfContainer.appendChild(canvas);

            await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

            document.getElementById('page-input').value = num;
            document.getElementById('btn-prev').disabled = num <= 1;
            document.getElementById('btn-next').disabled = num >= totalPages;

            showExtractedText(num);
        }

        function showExtractedText(num) {
            const data = allPageData[num];
            if (!data || data.paragraphs.length === 0) {
                extractedTextEl.innerHTML = '<p style="color:var(--text-light);">No se pudo extraer texto.</p>';
                extractedTextEl.classList.remove('hidden');
                return;
            }

            let html = '';
            for (const para of data.paragraphs) {
                const t = para.trim();
                if (!t) continue;

                const isTitle = t.length < 70 && !t.endsWith('.') && !t.endsWith(',') && !t.endsWith(':');
                const isSubtitle = t.length >= 70 && t.length < 130 && !t.endsWith('.');

                if (isTitle) {
                    html += `<div class="t-heading">${esc(t)}</div>`;
                } else if (isSubtitle) {
                    html += `<div class="t-sub">${esc(t)}</div>`;
                } else {
                    html += `<div class="t-para">${esc(t)}</div>`;
                }
            }

            extractedTextEl.innerHTML = html;
            extractedTextEl.classList.remove('hidden');
        }

        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        function prevPage() { if (currentPage > 1) { currentPage--; renderPage(currentPage); } }
        function nextPage() { if (currentPage < totalPages) { currentPage++; renderPage(currentPage); } }
        function goToPage(v) { const p = parseInt(v); if (p >= 1 && p <= totalPages) { currentPage = p; renderPage(currentPage); } }
        function switchTab(t) {
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            document.querySelector(`[data-tab="${t}"]`).classList.add('active');
            document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
            document.getElementById(`panel-${t}`).classList.add('active');
        }

        // Speech
        function speakSelected() {
            const sel = window.getSelection().toString().trim();
            speak(sel || extractedTextEl.innerText);
        }
        function speak(text) {
            stopSpeech();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'es-ES';
            u.rate = parseFloat(document.getElementById('speech-rate').value);
            const vs = document.getElementById('voice-select');
            if (vs.value) u.voice = speechSynthesis.getVoices()[parseInt(vs.value)];
            u.onstart = () => { document.getElementById('btn-speak').disabled = true; document.getElementById('btn-pause').disabled = false; document.getElementById('btn-stop').disabled = false; };
            u.onend = () => { document.getElementById('btn-speak').disabled = false; document.getElementById('btn-pause').disabled = true; document.getElementById('btn-stop').disabled = true; };
            speechSynthesis.speak(u);
        }
        function pauseSpeech() { if (speechSynthesis.speaking) speechSynthesis.paused ? speechSynthesis.resume() : speechSynthesis.pause(); }
        function stopSpeech() {
            speechSynthesis.cancel();
            document.getElementById('btn-speak').disabled = false;
            document.getElementById('btn-pause').disabled = true;
            document.getElementById('btn-stop').disabled = true;
        }
        function loadVoices() {
            const voices = speechSynthesis.getVoices();
            const select = document.getElementById('voice-select');
            select.innerHTML = '';
            const esVoices = voices.filter(v => v.lang.startsWith('es'));
            (esVoices.length > 0 ? esVoices : voices).forEach(v => {
                const opt = document.createElement('option');
                opt.value = voices.indexOf(v);
                opt.textContent = `${v.name} (${v.lang})`;
                select.appendChild(opt);
            });
        }
        speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        // Quiz
        async function generateQuiz() {
            const start = parseInt(document.getElementById('quiz-start').value);
            const end = parseInt(document.getElementById('quiz-end').value);
            const count = parseInt(document.getElementById('quiz-count').value);
            const type = document.getElementById('quiz-type').value;

            if (start < 1 || end > totalPages || start > end) { notify('Rango invalido'); return; }
            if (count < 1 || count > 20) { notify('Numero de preguntas invalido'); return; }

            // Collect all sentences from selected pages
            let allSentences = [];
            let rawContent = '';
            for (let i = start; i <= end; i++) {
                const data = allPageData[i];
                if (!data) continue;
                rawContent += '\n\n' + data.cleanText;
                for (const para of data.paragraphs) {
                    const sents = para.split(/(?<=[.!?])\s+/).filter(s => s.trim().length > 15);
                    allSentences.push(...sents.map(s => ({ text: s.trim(), page: i })));
                }
            }

            rawContent = rawContent.trim();
            if (!rawContent || allSentences.length === 0) { notify('No hay contenido suficiente'); return; }

            // Try Gemini first
            if (apiKey) {
                document.getElementById('quiz-loading').classList.add('show');
                document.getElementById('quiz-area').innerHTML = '';
                document.getElementById('quiz-results').style.display = 'none';
                document.getElementById('check-area').classList.add('hidden');

                try {
                    const prompt = buildPrompt(rawContent, count, type);
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: { temperature: 0.2, maxOutputTokens: 8192 }
                        })
                    });

                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error?.message || 'Error ' + response.status);

                    const rawText = data.candidates[0].content.parts[0].text;
                    const jsonMatch = rawText.match(/\{[\s\S]*\}/);
                    if (!jsonMatch) throw new Error('No se encontro JSON');

                    const parsed = JSON.parse(jsonMatch[0]);
                    if (!parsed.questions || !Array.isArray(parsed.questions) || parsed.questions.length === 0) {
                        throw new Error('JSON sin preguntas validas');
                    }

                    quizQuestions = parsed.questions;
                    renderQuiz();
                    notify(`${quizQuestions.length} preguntas generadas`);
                    document.getElementById('quiz-loading').classList.remove('show');
                    return;

                } catch (err) {
                    console.error('Gemini error:', err);
                    notify('Gemini fallo: ' + err.message + '. Generando localmente...');
                }

                document.getElementById('quiz-loading').classList.remove('show');
            }

            // Offline fallback
            generateOfflineQuiz(allSentences, count, type);
        }

        function buildPrompt(content, count, type) {
            let typeInstructions;
            if (type === 'multiple') {
                typeInstructions = 'TODAS las preguntas deben ser de multiple opcion con exactamente 4 alternativas (A, B, C, D). Solo una respuesta correcta por pregunta.';
            } else if (type === 'verdadero') {
                typeInstructions = 'TODAS las preguntas deben ser de Verdadero o Falso. Las opciones SIEMPRE deben ser ["Verdadero", "Falso"]. El campo "correct" debe ser 0 para Verdadero y 1 para Falso.';
            } else {
                typeInstructions = 'MEZCLA: genera aproximadamente la mitad como multiple opcion (4 alternativas) y la mitad como Verdadero/Falso.';
            }

            return `Eres un profesor experto. Crea ${count} preguntas de examen basadas en el siguiente texto.

TEXTO:
${content.substring(0, 12000)}

REGLAS:
1. Cada pregunta debe tener UNA RESPUESTA CLARA y correcta que se pueda determinar leyendo el texto.
2. Las preguntas deben evaluar COMPRENSION, no solo memorizacion. Por ejemplo:
   - "Cuantos planetas tiene el Sistema Solar?" -> respuesta: "8"
   - "Que tipo de estrella es el Sol?" -> respuesta: "Estrella tipo G2V / enana amarilla"
   - "Que fuerza mantiene los objetos orbitando?" -> respuesta: "La gravedad"
   - "De que se forma el Sistema Solar?" -> respuesta: "Del colapso de una nube molecular"
3. Las opciones incorrectas deben ser creibles y del mismo tema, NO respuestas absurdas.
4. NUNCA pongas fragmentos de texto como opciones. Las opciones deben ser respuestas cortas y directas.
5. Cada pregunta debe tener una explicacion de 1-2 oraciones citando el texto.

${typeInstructions}

RESPONDE SOLO CON JSON VALIDO:
{"questions":[{"question":"pregunta clara y directa","options":["respuesta A","respuesta B","respuesta C","respuesta D"],"correct":0,"explanation":"explicacion breve basada en el texto"}]}`;
        }

        function generateOfflineQuiz(allSentences, count, type) {
            if (allSentences.length === 0) { notify('No hay suficiente contenido'); return; }

            quizQuestions = [];
            const used = new Set();

            // Extract key facts: find sentences with definable content
            const facts = allSentences.filter(s => {
                const t = s.text.toLowerCase();
                return t.includes(' es ') || t.includes(' son ') || t.includes(' tiene ') ||
                       t.includes(' se ') || t.includes('.form') || t.includes('concentr') ||
                       t.includes(' classific') || t.includes(' tipo ') || t.includes(' mas ') ||
                       t.includes('consta') || t.includes(' contien') || t.includes(' orbit');
            });

            // Use all sentences as backup
            const pool = facts.length > 3 ? facts : allSentences;

            for (let i = 0; i < count && used.size < pool.length; i++) {
                // Pick a sentence we haven't used
                let idx = Math.floor(Math.random() * pool.length);
                let attempts = 0;
                while (used.has(idx) && attempts < pool.length) {
                    idx = (idx + 1) % pool.length;
                    attempts++;
                }
                if (used.has(idx)) break;
                used.add(idx);

                const sentence = pool[idx];

                if (type === 'verdadero' || (type === 'mezcla' && i % 2 === 1)) {
                    // True/False: use the actual sentence as true statement
                    // For false, modify a key number or fact
                    const isTrue = Math.random() > 0.4;
                    let statement = sentence.text;

                    if (!isTrue) {
                        // Try to make it false by changing a number or key word
                        statement = makeFalse(statement);
                    }

                    quizQuestions.push({
                        question: statement,
                        options: ['Verdadero', 'Falso'],
                        correct: isTrue ? 0 : 1,
                        explanation: isTrue
                            ? `Correcto. El texto dice: "${sentence.text.substring(0, 100)}..."`
                            : `Incorrecto. La afirmacion original del texto es diferente.`
                    });
                } else {
                    // Multiple choice: extract a key fact and create options
                    const questionData = createMultipleQuestion(sentence, pool, idx);
                    if (questionData) {
                        quizQuestions.push(questionData);
                    }
                }
            }

            if (quizQuestions.length === 0) {
                notify('No se pudieron generar preguntas');
                return;
            }

            renderQuiz();
            notify(`${quizQuestions.length} preguntas generadas`);
        }

        function makeFalse(statement) {
            // Change numbers
            let modified = statement.replace(/\b(\d+)\b/g, (match, num) => {
                const n = parseInt(num);
                if (n === 1) return '2';
                if (n > 1 && n < 100) return String(n + Math.floor(Math.random() * 3) + 1);
                return num;
            });

            // If no numbers changed, swap a word
            if (modified === statement) {
                const swaps = [
                    ['gravedad', 'magnetismo'], ['magnetismo', 'gravedad'],
                    ['sol', 'luna'], ['luna', 'sol'],
                    ['planetas', 'estrellas'], ['estrellas', 'planetas'],
                    ['mayor', 'menor'], ['menor', 'mayor'],
                    ['formo', 'no formo'], ['contiene', 'no contiene']
                ];
                for (const [from, to] of swaps) {
                    if (statement.toLowerCase().includes(from)) {
                        modified = statement.replace(new RegExp(from, 'i'), to);
                        break;
                    }
                }
            }

            return modified;
        }

        function createMultipleQuestion(sentence, pool, correctIdx) {
            const text = sentence.text;

            // Extract the key subject and predicate
            // Pattern: "X es/son/tiene/se..."
            const match = text.match(/^(.{5,60})\s+(es|son|tiene|se|consta|contiene|concentra|clasific|formo|orbit|mantiene|ejerce|afecta|produce|genera|representa|constituye|pertenece)\s+(.+)/i);

            if (match) {
                const subject = match[1].trim();
                const verb = match[2];
                const predicate = match[3].trim().replace(/[.!?]+$/, '');

                // Question: "Que [verb] [subject]?"
                const question = `Segun el texto, ${verb} ${subject.toLowerCase()}?`;
                const correctAnswer = predicate.length > 80 ? predicate.substring(0, 77) + '...' : predicate;

                // Generate distractors from other sentences
                const distractors = [];
                for (let j = 0; j < pool.length && distractors.length < 3; j++) {
                    if (j === correctIdx) continue;
                    const otherText = pool[j].text;
                    const otherMatch = otherText.match(/^(?:.{5,60})\s+(?:es|son|tiene|se|consta|contiene|concentra|clasific|formo|orbit|mantiene|ejerce|afecta|produce|genera|representa|constituye|pertenece)\s+(.+)/i);
                    if (otherMatch) {
                        let d = otherMatch[1].trim().replace(/[.!?]+$/, '');
                        if (d.length > 80) d = d.substring(0, 77) + '...';
                        if (d !== correctAnswer && !distractors.includes(d)) {
                            distractors.push(d);
                        }
                    }
                }

                while (distractors.length < 3) {
                    distractors.push('No se especifica en el texto');
                }

                const options = [correctAnswer, ...distractors.slice(0, 3)].sort(() => Math.random() - 0.5);

                return {
                    question,
                    options,
                    correct: options.indexOf(correctAnswer),
                    explanation: `Segun el texto: "${text.substring(0, 120)}..."`
                };
            }

            // Fallback: use the sentence as context for a simpler question
            const words = text.split(/\s+/);
            const subject = words.slice(0, Math.min(4, words.length)).join(' ');
            const question = `Que afirmacion es correcta sobre "${subject}"?`;
            const correctAnswer = text.length > 80 ? text.substring(0, 77) + '...' : text;

            const distractors = [];
            for (let j = 0; j < pool.length && distractors.length < 3; j++) {
                if (j === correctIdx) continue;
                let d = pool[j].text;
                if (d.length > 80) d = d.substring(0, 77) + '...';
                if (d !== correctAnswer && !distractors.includes(d)) {
                    distractors.push(d);
                }
            }
            while (distractors.length < 3) distractors.push('Afirmacion no disponible');

            const options = [correctAnswer, ...distractors.slice(0, 3)].sort(() => Math.random() - 0.5);

            return {
                question,
                options,
                correct: options.indexOf(correctAnswer),
                explanation: `Informacion basada en el texto.`
            };
        }

        function renderQuiz() {
            const area = document.getElementById('quiz-area');
            area.innerHTML = '';

            quizQuestions.forEach((q, i) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.innerHTML = `
                    <div class="q-header">
                        <span class="q-number">${i + 1}</span>
                        <span class="q-text">${esc(q.question)}</span>
                        <button class="listen-btn" onclick="event.stopPropagation(); speak(\`${q.question.replace(/`/g, "'").replace(/\\/g, '')}\`)">&#127908;</button>
                    </div>
                    <div class="options">
                        ${q.options.map((opt, j) => `
                            <div class="option" data-q="${i}" data-opt="${j}" onclick="selectOption(this, ${i}, ${j})">
                                <input type="radio" name="q${i}" id="q${i}o${j}">
                                <span><strong>${String.fromCharCode(65 + j)}.</strong> ${esc(opt)}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="explanation" id="exp-${i}">${esc(q.explanation || '')}</div>
                `;
                area.appendChild(card);
            });

            document.getElementById('check-area').classList.remove('hidden');
        }

        function selectOption(el, qIdx) {
            document.querySelectorAll(`[data-q="${qIdx}"]`).forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
            el.querySelector('input').checked = true;
        }

        function checkAnswers() {
            let correct = 0;
            quizQuestions.forEach((q, i) => {
                const options = document.querySelectorAll(`[data-q="${i}"]`);
                const selected = document.querySelector(`input[name="q${i}"]:checked`);

                options.forEach((opt, j) => {
                    opt.classList.remove('selected', 'correct', 'incorrect');
                    opt.style.pointerEvents = 'none';
                    if (j === q.correct) opt.classList.add('correct');
                    if (selected && parseInt(opt.dataset.opt) === parseInt(selected.value) && j !== q.correct) {
                        opt.classList.add('incorrect');
                    }
                });

                if (selected && parseInt(selected.value) === q.correct) correct++;
                document.getElementById(`exp-${i}`).classList.add('show');
            });

            document.getElementById('quiz-score').textContent = `${correct}/${quizQuestions.length}`;
            document.getElementById('quiz-results').style.display = 'block';
            document.getElementById('check-area').classList.add('hidden');
        }

        function resetQuiz() {
            document.getElementById('quiz-area').innerHTML = '';
            document.getElementById('quiz-results').style.display = 'none';
            document.getElementById('check-area').classList.add('hidden');
            quizQuestions = [];
        }

        function openConfig() {
            document.getElementById('api-key-input').value = apiKey;
            document.getElementById('config-modal').classList.add('show');
        }
        function closeConfig() { document.getElementById('config-modal').classList.remove('show'); }
        function saveConfig() {
            apiKey = document.getElementById('api-key-input').value.trim();
            localStorage.setItem('gemini_api_key', apiKey);
            updateApiStatus();
            closeConfig();
            notify(apiKey ? 'API key guardada' : 'API key eliminada');
        }
        function updateApiStatus() {
            const el = document.getElementById('api-status');
            if (apiKey) { el.textContent = 'Gemini OK'; el.className = 'api-status connected'; }
            else { el.textContent = 'Sin API'; el.className = 'api-status disconnected'; }
        }
        function notify(msg) {
            const el = document.getElementById('notification');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3500);
        }

        window.addEventListener('resize', () => { if (pdfDoc) renderPage(currentPage); });
    </script>
</body>
