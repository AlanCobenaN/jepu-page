<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudiar</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #a78bfa;
            --primary-light: #c4b5fd;
            --primary-dark: #7c3aed;
            --bg: #0f0f14;
            --card: #1a1a24;
            --card-hover: #22222e;
            --text: #e8e6f0;
            --text-light: #9590a8;
            --border: #2a2a38;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        header {
            background: #1a1a24;
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .config-btn {
            background: var(--border);
            border: 1px solid #3a3a4a;
            color: var(--text);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .config-btn:hover { background: #3a3a4a; }
        .container { max-width: 900px; margin: 0 auto; padding: 1.5rem; }

        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 5rem 2rem;
            text-align: center;
            background: var(--card);
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 1.5rem;
        }
        .upload-zone:hover, .upload-zone.dragover { border-color: var(--primary); background: var(--card-hover); }
        .upload-zone .icon { font-size: 3rem; margin-bottom: 1rem; }
        .upload-zone h3 { color: var(--primary-light); margin-bottom: 0.5rem; }
        .upload-zone p { color: var(--text-light); font-size: 0.9rem; }
        .upload-zone input { display: none; }

        .tabs {
            display: flex; gap: 0.4rem; margin-bottom: 1rem;
            background: var(--card); padding: 0.3rem; border-radius: 12px; border: 1px solid var(--border);
        }
        .tab {
            flex: 1; padding: 0.7rem 1rem; border: none; background: transparent;
            border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 600;
            color: var(--text-light); transition: all 0.2s;
        }
        .tab.active { background: var(--primary-dark); color: white; }
        .tab:hover:not(.active) { background: var(--card-hover); }
        .panel { display: none; }
        .panel.active { display: block; }

        .pdf-viewer {
            background: var(--card); border-radius: 16px; border: 1px solid var(--border);
            overflow: hidden; margin-bottom: 1.5rem;
        }
        .pdf-controls {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.75rem 1rem; background: #12121a; border-bottom: 1px solid var(--border);
            gap: 0.5rem; flex-wrap: wrap;
        }
        .pdf-controls button {
            background: var(--primary-dark); color: white; border: none;
            padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer;
            font-size: 0.85rem; font-weight: 600;
        }
        .pdf-controls button:hover { background: var(--primary); }
        .pdf-controls button:disabled { opacity: 0.3; cursor: not-allowed; }
        .pdf-controls .page-jump {
            display: flex; align-items: center; gap: 0.4rem;
            font-size: 0.85rem; color: var(--text-light);
        }
        .pdf-controls .page-jump input {
            width: 50px; padding: 0.35rem; border: 1px solid var(--border);
            border-radius: 6px; text-align: center; font-size: 0.85rem;
            background: var(--bg); color: var(--text);
        }

        #pdf-container { padding: 1rem; text-align: center; background: #0a0a0f; }
        #pdf-container canvas {
            max-width: 100%; box-shadow: 0 2px 16px rgba(0,0,0,0.5); border-radius: 4px;
        }

        .extracted-text {
            padding: 1.5rem; line-height: 2; font-size: 0.95rem;
            user-select: text; cursor: text;
            border-top: 1px solid var(--border); background: #12121a;
        }
        .extracted-text .t-heading {
            color: var(--primary-light); font-size: 1.1rem; font-weight: 700;
            margin: 1.5rem 0 0.5rem;
        }
        .extracted-text .t-heading:first-child { margin-top: 0; }
        .extracted-text .t-sub {
            color: var(--primary); font-size: 1rem; font-weight: 600;
            margin: 1rem 0 0.4rem;
        }
        .extracted-text .t-para {
            margin-bottom: 1rem; padding: 0.3rem 0.5rem; border-radius: 4px;
        }
        .extracted-text .t-para:hover { background: var(--card-hover); }

        .voice-controls {
            display: flex; gap: 0.5rem; padding: 0.75rem 1rem;
            background: #12121a; border-top: 1px solid var(--border);
            flex-wrap: wrap; align-items: center;
        }
        .voice-btn {
            background: var(--success); color: #0f0f14; border: none;
            padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer;
            font-weight: 600; font-size: 0.85rem; display: flex; align-items: center; gap: 0.3rem;
        }
        .voice-btn:hover { filter: brightness(1.15); }
        .voice-btn.stop { background: var(--danger); color: white; }
        .voice-btn.pause { background: var(--warning); color: #0f0f14; }
        .voice-settings {
            display: flex; align-items: center; gap: 0.5rem;
            margin-left: auto; flex-wrap: wrap;
        }
        .voice-settings label { font-size: 0.8rem; color: var(--text-light); }
        .voice-settings select, .voice-settings input[type="range"] {
            font-size: 0.8rem; padding: 0.3rem; border: 1px solid var(--border);
            border-radius: 6px; background: var(--bg); color: var(--text);
        }

        .quiz-section {
            background: var(--card); border-radius: 16px;
            border: 1px solid var(--border); padding: 1.5rem;
        }
        .quiz-config {
            display: flex; gap: 0.75rem; margin-bottom: 1.5rem;
            flex-wrap: wrap; align-items: end;
        }
        .quiz-config .field { flex: 1; min-width: 110px; }
        .quiz-config label {
            display: block; font-size: 0.75rem; color: var(--text-light);
            margin-bottom: 0.3rem; font-weight: 600; text-transform: uppercase;
        }
        .quiz-config input, .quiz-config select {
            width: 100%; padding: 0.6rem; border: 1px solid var(--border);
            border-radius: 8px; font-size: 0.9rem; background: var(--bg); color: var(--text);
        }
        .quiz-config input:focus, .quiz-config select:focus { outline: none; border-color: var(--primary); }
        .generate-btn {
            background: var(--primary-dark); color: white; border: none;
            padding: 0.6rem 1.5rem; border-radius: 8px; cursor: pointer;
            font-weight: 700; font-size: 0.9rem; white-space: nowrap;
        }
        .generate-btn:hover { background: var(--primary); }

        .loading { display: none; text-align: center; padding: 3rem; }
        .loading.show { display: block; }
        .spinner {
            width: 40px; height: 40px; border: 3px solid var(--border);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .question-card {
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem;
        }
        .question-card:hover { border-color: var(--primary-dark); }
        .question-card .q-header {
            display: flex; align-items: flex-start; gap: 0.6rem; margin-bottom: 0.75rem;
        }
        .question-card .q-number {
            background: var(--primary-dark); color: white;
            min-width: 28px; height: 28px; border-radius: 50%;
            text-align: center; line-height: 28px; font-size: 0.8rem;
            font-weight: 700; flex-shrink: 0;
        }
        .question-card .q-text { font-weight: 600; font-size: 0.95rem; line-height: 1.5; flex: 1; }
        .question-card .listen-btn {
            background: none; border: 1px solid var(--primary-dark);
            color: var(--primary-light); padding: 0.2rem 0.5rem; border-radius: 6px;
            cursor: pointer; font-size: 0.7rem; flex-shrink: 0;
        }
        .question-card .listen-btn:hover { background: var(--card-hover); }
        .question-card .options { margin-top: 0.5rem; }
        .question-card .option {
            display: flex; align-items: flex-start; gap: 0.6rem;
            padding: 0.65rem 0.8rem; border: 1px solid var(--border);
            border-radius: 8px; margin-bottom: 0.4rem; cursor: pointer;
            font-size: 0.9rem; line-height: 1.4; transition: all 0.2s;
        }
        .question-card .option:hover { background: var(--card-hover); border-color: var(--primary-dark); }
        .question-card .option.selected { background: rgba(124,58,237,0.15); border-color: var(--primary); }
        .question-card .option.correct { background: rgba(34,197,94,0.2); border-color: #22c55e; color: #4ade80; font-weight: 600; }
        .question-card .option.incorrect { background: rgba(239,68,68,0.25); border-color: #ef4444; color: #f87171; font-weight: 600; text-decoration: line-through; }
        .question-card .option input { display: none; }
        .question-card .explanation {
            margin-top: 0.75rem; padding: 0.75rem;
            background: rgba(251,191,36,0.06); border: 1px solid rgba(251,191,36,0.2);
            border-radius: 8px; font-size: 0.85rem; color: var(--warning);
            line-height: 1.5; display: none;
        }
        .question-card .explanation.show { display: block; }

        .quiz-results {
            display: none; text-align: center; padding: 2.5rem;
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 12px; margin-top: 1rem;
        }
        .quiz-results .score { font-size: 3rem; font-weight: 800; color: var(--primary-light); }
        .quiz-results .score-label { font-size: 1rem; color: var(--text-light); margin-top: 0.5rem; }
        .check-btn {
            background: var(--success); color: #0f0f14; border: none;
            padding: 0.7rem 2rem; border-radius: 8px; cursor: pointer;
            font-weight: 700; font-size: 1rem; margin-top: 1.5rem;
        }
        .check-btn:hover { filter: brightness(1.1); }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.7);
            z-index: 200; align-items: center; justify-content: center; padding: 1rem;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 1.5rem; max-width: 420px; width: 100%;
        }
        .modal h3 { margin-bottom: 0.75rem; color: var(--primary-light); }
        .modal input {
            width: 100%; padding: 0.6rem; border: 1px solid var(--border);
            border-radius: 8px; font-size: 0.85rem; background: var(--bg); color: var(--text);
        }
        .modal .btn-row { display: flex; gap: 0.5rem; margin-top: 1rem; justify-content: flex-end; }
        .modal .btn-row button { padding: 0.5rem 1rem; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
        .modal .btn-row .save-btn { background: var(--primary-dark); color: white; }
        .modal .btn-row .cancel-btn { background: var(--border); color: var(--text); }

        .hidden { display: none !important; }
        .notification {
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
            background: var(--card); color: var(--text); padding: 0.6rem 1.2rem;
            border-radius: 10px; font-size: 0.8rem; border: 1px solid var(--border);
            z-index: 300; opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .notification.show { opacity: 1; }
        .api-status {
            font-size: 0.65rem; padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: 600;
        }
        .api-status.connected { background: rgba(52,211,153,0.15); color: var(--success); }
        .api-status.disconnected { background: rgba(248,113,113,0.15); color: var(--danger); }
        .header-left { display: flex; align-items: center; gap: 0.5rem; }

        @media (max-width: 640px) {
            .container { padding: 1rem; }
            .tabs { flex-direction: column; }
            .tab { font-size: 0.85rem; }
            .pdf-controls { flex-direction: column; align-items: stretch; }
            .quiz-config { flex-direction: column; }
            .quiz-config .field { min-width: 100%; }
            .voice-controls { flex-direction: column; align-items: stretch; }
            .voice-settings { margin-left: 0; justify-content: space-between; }
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    </style>
</head>
<body>
    <header>
        <div class="header-left"><span id="api-status" class="api-status disconnected">Sin API</span></div>
        <button class="config-btn" onclick="openConfig()">API Key</button>
    </header>

    <div class="container">
        <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()">
            <div class="icon">&#128211;</div>
            <h3>Sube tu PDF de estudio</h3>
            <p>Arrastra un archivo aqui o haz clic para seleccionar</p>
            <input type="file" id="file-input" accept=".pdf">
        </div>

        <div class="tabs hidden" id="main-tabs">
            <button class="tab active" data-tab="reader" onclick="switchTab('reader')">Lector de Voz</button>
            <button class="tab" data-tab="quiz" onclick="switchTab('quiz')">Generar Preguntas</button>
        </div>

        <div class="panel active" id="panel-reader">
            <div class="pdf-viewer">
                <div class="pdf-controls">
                    <button onclick="prevPage()" id="btn-prev">&#9664; Anterior</button>
                    <div class="page-jump">
                        <span>Pagina</span>
                        <input type="number" id="page-input" min="1" value="1" onchange="goToPage(this.value)">
                        <span>de <span id="total-pages">0</span></span>
                    </div>
                    <button onclick="nextPage()" id="btn-next">Siguiente &#9654;</button>
                </div>
                <div id="pdf-container"></div>
                <div id="extracted-text" class="hidden"></div>
                <div class="voice-controls">
                    <button class="voice-btn" onclick="speakSelected()" id="btn-speak">&#127908; Leer seleccion</button>
                    <button class="voice-btn pause" onclick="pauseSpeech()" id="btn-pause" disabled>&#9208; Pausar</button>
                    <button class="voice-btn stop" onclick="stopSpeech()" id="btn-stop" disabled>&#9632; Detener</button>
                    <div class="voice-settings">
                        <label>Velocidad:</label>
                        <input type="range" id="speech-rate" min="0.5" max="2" step="0.1" value="1" style="width:70px">
                        <label>Voz:</label>
                        <select id="voice-select"></select>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel" id="panel-quiz">
            <div class="quiz-section">
                <div class="quiz-config">
                    <div class="field">
                        <label>Desde pagina</label>
                        <input type="number" id="quiz-start" min="1" value="1">
                    </div>
                    <div class="field">
                        <label>Hasta pagina</label>
                        <input type="number" id="quiz-end" min="1" value="5">
                    </div>
                    <div class="field">
                        <label>Preguntas</label>
                        <input type="number" id="quiz-count" min="1" max="20" value="5">
                    </div>
                    <div class="field">
                        <label>Tipo</label>
                        <select id="quiz-type">
                            <option value="multiple">Multiple opcion</option>
                            <option value="verdadero">Verdadero / Falso</option>
                            <option value="mezcla">Mezcla</option>
                        </select>
                    </div>
                    <button class="generate-btn" onclick="generateQuiz()" id="btn-generate">Generar</button>
                </div>

                <div class="loading" id="quiz-loading">
                    <div class="spinner"></div>
                    <p style="color:var(--text-light);">Generando preguntas...</p>
                </div>

                <div id="quiz-area"></div>
                <div class="quiz-results" id="quiz-results">
                    <div class="score" id="quiz-score">0/0</div>
                    <div class="score-label">Preguntas correctas</div>
                    <button class="check-btn" onclick="resetQuiz()">Volver a intentar</button>
                </div>
                <div class="hidden" id="check-area" style="text-align:center;margin-top:1.5rem;">
                    <button class="check-btn" onclick="checkAnswers()">Verificar respuestas</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="config-modal">
        <div class="modal">
            <h3>Configuracion API</h3>
            <p style="font-size:0.8rem;color:var(--text-light);margin-bottom:0.75rem;">
                API key de Google Gemini.
                <br><a href="https://aistudio.google.com/apikey" target="_blank" style="color:var(--primary-light);">Obtener API key gratis</a>
            </p>
            <input type="password" id="api-key-input" placeholder="Pega tu API key aqui...">
            <div class="btn-row">
                <button class="cancel-btn" onclick="closeConfig()">Cancelar</button>
                <button class="save-btn" onclick="saveConfig()">Guardar</button>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfDoc = null;
        let currentPage = 1;
        let totalPages = 0;
        let allPageData = {};
        let apiKey = localStorage.getItem('gemini_api_key') || 'AIzaSyBIHCO5RhEv6VeoOZERi3ynvvet1hEuS5A';
        let quizQuestions = [];

        const uploadZone = document.getElementById('upload-zone');
        const fileInput = document.getElementById('file-input');
        const pdfContainer = document.getElementById('pdf-container');
        const extractedTextEl = document.getElementById('extracted-text');

        updateApiStatus();

        fileInput.addEventListener('change', e => { if (e.target.files[0]) loadPDF(e.target.files[0]); });
        uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
        uploadZone.addEventListener('drop', e => {
            e.preventDefault(); uploadZone.classList.remove('dragover');
            if (e.dataTransfer.files[0]) loadPDF(e.dataTransfer.files[0]);
        });

        async function loadPDF(file) {
            const arrayBuffer = await file.arrayBuffer();
            pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            totalPages = pdfDoc.numPages;
            currentPage = 1;

            document.getElementById('total-pages').textContent = totalPages;
            document.getElementById('page-input').max = totalPages;
            document.getElementById('quiz-end').max = totalPages;
            document.getElementById('quiz-end').value = Math.min(5, totalPages);
            document.getElementById('main-tabs').classList.remove('hidden');
            uploadZone.innerHTML = `<div class="icon">&#9989;</div><h3>${file.name}</h3><p>${totalPages} paginas listas</p>`;
            uploadZone.style.cursor = 'default';
            uploadZone.onclick = null;

            await extractAllPages();
            renderPage(currentPage);
            notify('PDF cargado');
        }

        async function extractAllPages() {
            allPageData = {};

            for (let i = 1; i <= totalPages; i++) {
                const page = await pdfDoc.getPage(i);
                const textContent = await page.getTextContent();
                const items = textContent.items;

                if (items.length === 0) {
                    allPageData[i] = { lines: [], paragraphs: [], cleanText: '' };
                    continue;
                }

                // Build lines by grouping items at similar Y positions
                const lineItems = [];
                let currentLineItems = [items[0]];

                for (let k = 1; k < items.length; k++) {
                    const prev = items[k - 1];
                    const curr = items[k];
                    const yDiff = Math.abs(curr.y - prev.y);

                    if (yDiff > 2) {
                        lineItems.push(currentLineItems);
                        currentLineItems = [curr];
                    } else {
                        currentLineItems.push(curr);
                    }
                }
                lineItems.push(currentLineItems);

                // Convert line items to line strings with Y positions
                const lines = lineItems.map(lineItemArr => {
                    let text = '';
                    const y = lineItemArr[0].y;
                    for (const item of lineItemArr) {
                        const prev = lineItemArr[lineItemArr.indexOf(item) - 1];
                        if (prev) {
                            const xGap = item.transform[4] - (prev.transform[4] + (prev.width || 0));
                            if (xGap > 5) text += ' ';
                            else if (xGap < -5) text += ' ';
                        }
                        text += item.str;
                    }
                    return { text: text.trim(), y };
                }).filter(l => l.text.length > 0);

                // Build paragraphs: detect breaks by Y gaps and line endings
                const paragraphs = [];
                let currentParagraph = [lines[0]];

                for (let j = 1; j < lines.length; j++) {
                    const prev = lines[j - 1];
                    const curr = lines[j];
                    const yGap = Math.abs(prev.y - curr.y);
                    const prevEndsWithPeriod = prev.text.endsWith('.') || prev.text.endsWith(':') || prev.text.endsWith(';');
                    const isShortLine = prev.text.length < 60 && !prevEndsWithPeriod;

                    const isBreak = yGap > 8 || (yGap > 3 && prevEndsWithPeriod) || (yGap > 3 && isShortLine);

                    if (isBreak) {
                        paragraphs.push(currentParagraph.map(l => l.text).join(' '));
                        currentParagraph = [curr];
                    } else {
                        currentParagraph.push(curr);
                    }
                }
                if (currentParagraph.length > 0) {
                    paragraphs.push(currentParagraph.map(l => l.text).join(' '));
                }

                // Merge very short paragraphs with next (likely fragments)
                const mergedParagraphs = [];
                for (let p = 0; p < paragraphs.length; p++) {
                    const text = paragraphs[p].trim();
                    if (text.length < 40 && mergedParagraphs.length > 0) {
                        mergedParagraphs[mergedParagraphs.length - 1] += ' ' + text;
                    } else {
                        mergedParagraphs.push(text);
                    }
                }

                allPageData[i] = {
                    lines: lines.map(l => l.text),
                    paragraphs: mergedParagraphs,
                    cleanText: mergedParagraphs.join('\n\n')
                };
            }
        }

        async function renderPage(num) {
            const page = await pdfDoc.getPage(num);
            const containerWidth = pdfContainer.clientWidth - 32;
            const unscaledViewport = page.getViewport({ scale: 1 });
            const scale = Math.min(containerWidth / unscaledViewport.width, 2);
            const viewport = page.getViewport({ scale });

            pdfContainer.innerHTML = '';
            const canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            pdfContainer.appendChild(canvas);

            await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

            document.getElementById('page-input').value = num;
            document.getElementById('btn-prev').disabled = num <= 1;
            document.getElementById('btn-next').disabled = num >= totalPages;

            showExtractedText(num);
        }

        function showExtractedText(num) {
            const data = allPageData[num];
            if (!data || data.paragraphs.length === 0) {
                extractedTextEl.innerHTML = '<p style="color:var(--text-light);">No se pudo extraer texto.</p>';
                extractedTextEl.classList.remove('hidden');
                return;
            }

            let html = '';
            for (const para of data.paragraphs) {
                const t = para.trim();
                if (!t) continue;

                const isTitle = t.length < 70 && !t.endsWith('.') && !t.endsWith(',') && !t.endsWith(':');
                const isSubtitle = t.length >= 70 && t.length < 130 && !t.endsWith('.');

                if (isTitle) {
                    html += `<div class="t-heading">${esc(t)}</div>`;
                } else if (isSubtitle) {
                    html += `<div class="t-sub">${esc(t)}</div>`;
                } else {
                    html += `<div class="t-para">${esc(t)}</div>`;
                }
            }

            extractedTextEl.innerHTML = html;
            extractedTextEl.classList.remove('hidden');
        }

        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        function prevPage() { if (currentPage > 1) { currentPage--; renderPage(currentPage); } }
        function nextPage() { if (currentPage < totalPages) { currentPage++; renderPage(currentPage); } }
        function goToPage(v) { const p = parseInt(v); if (p >= 1 && p <= totalPages) { currentPage = p; renderPage(currentPage); } }
        function switchTab(t) {
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            document.querySelector(`[data-tab="${t}"]`).classList.add('active');
            document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
            document.getElementById(`panel-${t}`).classList.add('active');
        }

        // Speech
        function speakSelected() {
            const sel = window.getSelection().toString().trim();
            speak(sel || extractedTextEl.innerText);
        }
        function speak(text) {
            stopSpeech();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'es-ES';
            u.rate = parseFloat(document.getElementById('speech-rate').value);
            const vs = document.getElementById('voice-select');
            if (vs.value) u.voice = speechSynthesis.getVoices()[parseInt(vs.value)];
            u.onstart = () => { document.getElementById('btn-speak').disabled = true; document.getElementById('btn-pause').disabled = false; document.getElementById('btn-stop').disabled = false; };
            u.onend = () => { document.getElementById('btn-speak').disabled = false; document.getElementById('btn-pause').disabled = true; document.getElementById('btn-stop').disabled = true; };
            speechSynthesis.speak(u);
        }
        function pauseSpeech() { if (speechSynthesis.speaking) speechSynthesis.paused ? speechSynthesis.resume() : speechSynthesis.pause(); }
        function stopSpeech() {
            speechSynthesis.cancel();
            document.getElementById('btn-speak').disabled = false;
            document.getElementById('btn-pause').disabled = true;
            document.getElementById('btn-stop').disabled = true;
        }
        function loadVoices() {
            const voices = speechSynthesis.getVoices();
            const select = document.getElementById('voice-select');
            select.innerHTML = '';
            const esVoices = voices.filter(v => v.lang.startsWith('es'));
            (esVoices.length > 0 ? esVoices : voices).forEach(v => {
                const opt = document.createElement('option');
                opt.value = voices.indexOf(v);
                opt.textContent = `${v.name} (${v.lang})`;
                select.appendChild(opt);
            });
        }
        speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        // ========== QUIZ GENERATION ==========

        // Filter: skip titles, headers, short fragments, document names
        const SKIP_PATTERNS = [
            /^\s*(introduccion|conclusion|capitulo|indice|bibliografia|resumen|abstract|indice)\s*$/i,
            /^.{0,30}\|/, // page headers
            /^.{0,20}:$/, // short labels ending in :
        ];

        function isUsableSentence(s) {
            if (!s || s.length < 25) return false;
            if (SKIP_PATTERNS.some(p => p.test(s))) return false;
            // Must end with period (complete sentence)
            if (!s.endsWith('.') && !s.endsWith('.\"') && !s.endsWith('."')) return false;
            // Must not be a title (no verb-like structure)
            const words = s.split(/\s+/);
            if (words.length < 5) return false;
            return true;
        }

        // Extract the subject and "what it is/does" from a sentence
        function extractFact(sentence) {
            const s = sentence.replace(/[¿"?]$/g, '').trim();

            // Pattern: "X es Y" / "X son Y" / "X tiene Y" / "X contiene Y" etc.
            const copulative = s.match(/^(.+?)\s+(es|son|está|estan|tiene|tiene como|contiene|concentra|mantiene|ejerce|clasifica(?:da|do|cion)|considera(?:da|do)|forma(?:da|do)|consta(?:da|do)?|se (?:encuentra|encuentran|forma|clasifica|considera|denominan?|conoce|define)|constituye(?:da|do)?|pertenece|orbita(?:da|do)?|se (?:encuentran?|hallan?))\s+(.+?)\.?\s*$/i);

            if (copulative) {
                return {
                    subject: copulative[1].trim(),
                    verb: copulative[2],
                    value: copulative[3].trim().replace(/[.]+$/, ''),
                    fullSentence: s
                };
            }
            return null;
        }

        // Build a proper question from a fact
        function buildQuestionFromFact(fact) {
            const subj = fact.subject.toLowerCase();
            const verb = fact.verb.toLowerCase();

            // Map verbs to natural question words
            if (verb.includes('es') || verb.includes('son') || verb.includes('est')) {
                if (verb.includes('clasific') || verb.includes('consider')) {
                    return `¿Cómo se clasifica/considera ${subj}?`;
                }
                if (verb.includes('encuentr') || verb.includes('hall')) {
                    return `¿Dónde se encuentra ${subj}?`;
                }
                return `¿Qué es ${subj}?`;
            }
            if (verb.includes('tiene') || verb.includes('contien')) {
                return `¿Qué tiene/contiene ${subj}?`;
            }
            if (verb.includes('concentr')) {
                return `¿Qué concentra ${subj}?`;
            }
            if (verb.includes('mantien') || verb.includes('ejerc')) {
                return `¿Qué función cumple ${subj}?`;
            }
            if (verb.includes('form')) {
                return `¿Cómo se forma ${subj}?`;
            }
            if (verb.includes('consta') || verb.includes('constituy')) {
                return `¿De qué consta ${subj}?`;
            }
            if (verb.includes('orbit')) {
                return `¿Qué orbita ${subj}?`;
            }
            // Generic fallback
            return `Según el texto, ¿qué se menciona sobre ${subj}?`;
        }

        // Find plausible distractors: similar-length complete sentences about different topics
        function findDistractors(pool, correctFact, excludeIdx, count) {
            const distractors = [];
            const correctValue = correctFact.value.toLowerCase();

            // Sort by sentence length similarity to correct answer
            const candidates = pool
                .map((s, i) => ({ ...s, idx: i }))
                .filter(c => c.idx !== excludeIdx && isUsableSentence(c.text))
                .map(c => {
                    const fact = extractFact(c.text);
                    if (!fact) return null;
                    // Skip if same subject
                    if (fact.subject.toLowerCase() === correctFact.subject.toLowerCase()) return null;
                    // Skip if same value
                    if (fact.value.toLowerCase() === correctValue) return null;
                    return { fact, length: fact.value.length };
                })
                .filter(Boolean)
                .sort((a, b) => Math.abs(a.length - correctFact.value.length) - Math.abs(b.length - correctFact.value.length));

            for (const c of candidates) {
                if (distractors.length >= count) break;
                // Must be a complete phrase, not truncated
                if (c.fact.value.length < 10) continue;
                distractors.push(c.fact.value);
            }

            return distractors;
        }

        // Validate a question has proper structure
        function validateQuestion(q) {
            if (!q || !q.question || !q.options || q.options.length < 2) return false;
            if (q.correct < 0 || q.correct >= q.options.length) return false;

            const qLower = q.question.trim().toLowerCase();
            const isV_F = q.options.length === 2 &&
                q.options.some(o => /^verdadero$/i.test(o)) &&
                q.options.some(o => /^falso$/i.test(o));

            if (!isV_F) {
                // Multiple choice: must start with question word
                const validStarts = ['¿', 'que ', 'qué ', 'cuál', 'cual', 'cuánto', 'cuanto',
                    'dónde', 'donde', 'cuándo', 'cuando', 'quién', 'quien', 'cómo', 'como',
                    'según', 'segun', 'de ', 'en ', 'por '];
                if (!validStarts.some(s => qLower.startsWith(s))) return false;
                // Must contain ¿
                if (!q.question.includes('¿')) return false;
            }

            // At least 15 characters
            if (q.question.trim().length < 15) return false;

            // No "..." in options
            for (const opt of q.options) {
                if (opt && opt.endsWith('...')) return false;
                if (opt && opt.length < 3) return false;
            }

            // No titles as options
            const titlePatterns = /^(introduccion|capitulo|conclusion|indice|bibliografia)/i;
            for (const opt of q.options) {
                if (titlePatterns.test(opt.trim())) return false;
            }

            // No broken fragments
            if (q.question.includes('se aún más lejos') || q.question.includes('se aun mas lejos')) return false;

            return true;
        }

        async function generateQuiz() {
            const start = parseInt(document.getElementById('quiz-start').value);
            const end = parseInt(document.getElementById('quiz-end').value);
            const count = parseInt(document.getElementById('quiz-count').value);
            const type = document.getElementById('quiz-type').value;

            if (start < 1 || end > totalPages || start > end) { notify('Rango invalido'); return; }
            if (count < 1 || count > 20) { notify('Numero de preguntas invalido'); return; }

            let allSentences = [];
            let rawContent = '';
            for (let i = start; i <= end; i++) {
                const data = allPageData[i];
                if (!data) continue;
                rawContent += '\n\n' + data.cleanText;
                for (const para of data.paragraphs) {
                    const sents = para.split(/(?<=[.!?])\s+/).filter(s => isUsableSentence(s.trim()));
                    allSentences.push(...sents.map(s => ({ text: s.trim(), page: i })));
                }
            }

            rawContent = rawContent.trim();
            if (!rawContent || allSentences.length === 0) { notify('No hay contenido suficiente'); return; }

            // Try Gemini first
            if (apiKey) {
                document.getElementById('quiz-loading').classList.add('show');
                document.getElementById('quiz-area').innerHTML = '';
                document.getElementById('quiz-results').style.display = 'none';
                document.getElementById('check-area').classList.add('hidden');

                try {
                    const prompt = buildGeminiPrompt(rawContent, count, type);
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: { temperature: 0.15, maxOutputTokens: 8192 }
                        })
                    });

                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error?.message || 'Error ' + response.status);

                    const rawText = data.candidates[0].content.parts[0].text;
                    const jsonMatch = rawText.match(/\{[\s\S]*\}/);
                    if (!jsonMatch) throw new Error('No se encontro JSON');

                    const parsed = JSON.parse(jsonMatch[0]);
                    if (!parsed.questions || !Array.isArray(parsed.questions) || parsed.questions.length === 0) {
                        throw new Error('JSON sin preguntas validas');
                    }

                    // Validate each question
                    const validQuestions = parsed.questions.filter(validateQuestion);
                    if (validQuestions.length === 0) {
                        throw new Error('Ninguna pregunta paso la validacion');
                    }

                    quizQuestions = validQuestions.slice(0, count);
                    renderQuiz();
                    notify(`${quizQuestions.length} preguntas generadas`);
                    document.getElementById('quiz-loading').classList.remove('show');
                    return;

                } catch (err) {
                    console.error('Gemini error:', err);
                    notify('Gemini fallo. Generando localmente...');
                }

                document.getElementById('quiz-loading').classList.remove('show');
            }

            // Offline fallback
            generateOfflineQuiz(allSentences, count, type);
        }

        function buildGeminiPrompt(content, count, type) {
            let typeLine, example;
            if (type === 'multiple') {
                typeLine = 'FORMATO: Todas las preguntas deben ser de multiple opcion con 4 alternativas (A, B, C, D). Solo una correcta. Campo "correct" es el indice (0-3) de la respuesta correcta.';
                example = `{"question":"¿Qué factores han permitido el desarrollo de ecosistemas complejos en la Tierra?","options":["Su distancia al Sol, agua líquida, atmósfera protectora y campo magnético","Su tamaño, su color y su temperatura media","La presencia de lunas, asteroides y cometas cercanos","Su posición en la Vía Láctea y su edad aproximada"],"correct":0,"explanation":"El texto menciona que la distancia al Sol, el agua líquida, una atmósfera protectora y un campo magnético estable son los factores que lo han permitido."}`;
            } else if (type === 'verdadero') {
                typeLine = 'FORMATO: Todas las preguntas deben ser de Verdadero/Falso. Opciones: ["Verdadero", "Falso"]. correct: 0 para V, 1 para F.';
                example = `{"question":"Los planetas rocosos del Sistema Solar están formados por roca y metal.","options":["Verdadero","Falso"],"correct":0,"explanation":"El texto indica que los cuatro planetas más cercanos al Sol son rocosos y están formados por roca y metal."}`;
            } else {
                typeLine = 'FORMATO: MEZCLA. La mitad aproximadamente como multiple opcion (4 alternativas) y la mitad como Verdadero/Falso.';
                example = `{"question":"¿Qué tipo de estrella es el Sol?","options":["Una estrella enana amarilla de tipo G2V","Una estrella gigante roja de tipo M","Una enana blanca de tipo D","Una supergigante azul de tipo O"],"correct":0,"explanation":"El texto clasifica al Sol como una estrella de tipo espectral G2V, comunmente conocida como enana amarilla."}`;
            }

            return `Eres un profesor universitario experto. Tu tarea es generar ${count} preguntas de examen de alta calidad basadas en el texto proporcionado.

=== TEXTO DEL LIBRO ===
${content.substring(0, 14000)}

=== REGLA CRITICA PREVIA ===
Los titulos, subtitulos y encabezados como "Introduccion", "Capitulo", "Conclusion", nombres de secciones o libros NO son contenido evaluable. ELIMINALOS completamente antes de procesar el texto. NUNCA pueden aparecer dentro de una pregunta ni en las opciones.

=== PROCESO OBLIGATORIO DE GENERACION EN 3 PASOS ===

Para cada oracion util del texto, aplica estos 3 pasos SIN EXCEPCION:

**Paso 1 — IDENTIFICAR:**
Determina cual es la entidad principal de la informacion (Sol, Jupiter, Mercurio, Urano, cinturon de asteroides, etc.) y cual es el dato que se quiere evaluar.

**Paso 2 — FORMULAR:**
Crea una pregunta NUEVA desde cero basada en esa relacion entidad-dato. NO transformes mecanicamente la oracion original en una pregunta.

**Paso 3 — VALIDAR:**
Comprueba que la pregunta pueda entenderse SIN el texto original y que la respuesta correcta responda DIRECTAMENTE a ella.

EJEMPLO DEL PROCESO:
Texto: "Su atmosfera esta dominada por hidrogeno y helio..."

Paso 1 — Entidad: Jupiter. Dato: composicion de su atmosfera.
Paso 2 — Pregunta: "¿Como es la atmosfera de Jupiter segun el texto?"
Paso 3 — Se entiende sola? SI. La respuesta responde a la pregunta? SI. → VALIDA.

NUNCA produzcas: "¿Que es su atmosfera?"

=== REGLAS CRITICAS ===

REGLA CRITICA 1: Si una pregunta contiene estructuras gramaticalmente anormales como "¿Que es se cree...?", "¿Que se menciona sobre es...?", "¿Que es su...?" o combina un titulo con una oracion, la pregunta es INVALIDA y debe regenerarse antes de mostrarse.

REGLA CRITICA 2: Los titulos, subtitulos y encabezados como "Introduccion" no forman parte del contenido y deben eliminarse antes de generar preguntas.

REGLA CRITICA 3: Nunca uses "su", "estos", "estos objetos", "ellos", etc. cuando el referente no este explicitamente identificado en la pregunta.

REGLA CRITICA 4: La pregunta debe construirse a partir del TIPO DE INFORMACION de la respuesta correcta. Si la respuesta describe una caracteristica de rotacion, pregunta por la rotacion. Si describe la composicion de una atmosfera, pregunta por la atmosfera. Si describe una ubicacion, pregunta por la ubicacion. No utilices preguntas genericas como "¿Que tiene/contiene X?" salvo que la respuesta realmente indique que contiene X.
  - MAL: "¿Que tiene Urano?" si la respuesta es "Su eje esta inclinado 98 grados"
  - MAL: "¿Que tiene la atmosfera?" si la respuesta es "capas de gases como nitrogeno y oxigeno"
  - BIEN: "¿Cual es la inclinacion del eje de Urano?"
  - BIEN: "¿De que gases esta compuesta la atmosfera terrestre?"

REGLA CRITICA 5: La respuesta correcta debe responder DIRECTAMENTE a lo que pregunta la pregunta. Si la respuesta no puede responderse con la informacion que contiene la pregunta, DESCARTA la pregunta y genera otra.

REGLA CRITICA 6: Si el texto contiene un pronombre como "su", "estos", "estos objetos", "ellos", etc., NUNCA utilices ese pronombre directamente en la pregunta. Primero identifica a que entidad se refiere y reemplaza el pronombre por el nombre de dicha entidad.
- Texto: "Su atmosfera esta dominada por hidrogeno y helio..."
❌ "¿Que es su atmosfera?"
✅ "¿Como es la atmosfera de Jupiter?"
- Texto: "Se cree que estos objetos son remanentes..."
❌ "¿Que es se cree que estos objetos?"
✅ "¿Que se cree que son los asteroides?"
- NUNCA generes una pregunta que contenga "¿Que es se cree...?" o "¿Que es su...?". Si aparece una estructura de este tipo, la pregunta es INVALIDA y debe regenerarse.

REGLA CRITICA 7: NO MODIFIQUES, ALTERES NI INVENTES NINGUN DATO DEL TEXTO. Las cifras, fechas, nombres, porcentajes, cantidades y demas datos deben conservarse EXACTAMENTE como aparecen en el texto. Si el texto dice 98 grados, no escribas 112 grados. Si no estas seguro de un dato, no lo cambies.

REGLA CRITICA 8: Cuando una pregunta de verdadero/falso se base en una oracion del texto, utiliza EXACTAMENTE la informacion de esa oracion. No introduzas cambios en cifras, nombres, cantidades o caracteres.

=== REGLAS DE CALIDAD ===

- La pregunta debe poder entenderse completamente sin leer el texto original.
- NUNCA empieces una pregunta con "¿Que es...?" si la respuesta no es una definicion.
- NUNCA mezcles partes de diferentes oraciones.
- Si una oracion no permite crear una pregunta clara, DESCARTALA y selecciona otra oracion del texto.
- Los distractores deben ser respuestas plausibles al mismo tipo de pregunta, no fragmentos aleatorios de otras partes del texto.
- La respuesta correcta debe ser una FRASE COMPLETA, nunca un fragmento cortado con "...".
- Los distractores deben tener la MISMA ESTRUCTURA que la respuesta correcta.
- NUNCA uses como opciones: titulos del documento, encabezados de seccion, nombres del libro.
- Para V/F: La afirmacion debe ser completa, independiente y comprensible sola. Incluye siempre el sujeto y contexto necesario.
  ❌ "Esta formado por roca y metal."
  ✅ "Los planetas rocosos del Sistema Solar estan formados por roca y metal."

${typeLine}

Cada explicacion debe citar que parte del texto respalda la respuesta.

DEVUELVE SOLO EL JSON FINAL:
{"questions":[${example}]}

IMPORTANTE: Responde SOLO con el JSON. Sin markdown, sin backticks, sin texto antes o despues.`;
        }

        // ========== OFFLINE QUIZ GENERATOR ==========

        function generateOfflineQuiz(allSentences, count, type) {
            if (allSentences.length === 0) { notify('No hay suficiente contenido'); return; }

            // Build facts from all usable sentences
            const facts = [];
            for (let i = 0; i < allSentences.length; i++) {
                const s = allSentences[i];
                if (!isUsableSentence(s.text)) continue;
                const fact = extractFact(s.text);
                if (fact && fact.value.length >= 10) {
                    facts.push({ ...fact, idx: i, page: s.page });
                }
            }

            if (facts.length < 2) {
                notify('No hay suficiente contenido factual para preguntas');
                return;
            }

            quizQuestions = [];
            const usedFacts = new Set();
            let attempts = 0;

            while (quizQuestions.length < count && attempts < count * 10) {
                attempts++;

                // Pick a random unused fact
                let factIdx = Math.floor(Math.random() * facts.length);
                let tries = 0;
                while (usedFacts.has(factIdx) && tries < facts.length) {
                    factIdx = (factIdx + 1) % facts.length;
                    tries++;
                }
                if (usedFacts.has(factIdx)) break;
                usedFacts.add(factIdx);

                const fact = facts[factIdx];

                if (type === 'verdadero' || (type === 'mezcla' && quizQuestions.length % 2 === 1)) {
                    // TRUE/FALSE question
                    const isTrue = Math.random() > 0.35;
                    let statement = fact.fullSentence;

                    if (!isTrue) {
                        // Make it false by changing a key detail
                        statement = makeFalseStatement(fact);
                    }

                    const q = {
                        question: statement.replace(/[.]$/, ''),
                        options: ['Verdadero', 'Falso'],
                        correct: isTrue ? 0 : 1,
                        explanation: `Según el texto: "${fact.fullSentence.substring(0, 150)}"`
                    };

                    if (validateQuestion(q)) {
                        quizQuestions.push(q);
                    }

                } else {
                    // MULTIPLE CHOICE question
                    const question = buildQuestionFromFact(fact);
                    const correctAnswer = fact.value;

                    // Find 3 distractors of similar type
                    const distractors = findDistractors(allSentences, fact, fact.idx, 3);

                    if (distractors.length < 2) continue; // Need at least 2 distractors

                    const options = [correctAnswer, ...distractors.slice(0, 3)]
                        .sort(() => Math.random() - 0.5);

                    const q = {
                        question,
                        options,
                        correct: options.indexOf(correctAnswer),
                        explanation: `Según el texto: "${fact.fullSentence.substring(0, 150)}"`
                    };

                    if (validateQuestion(q)) {
                        quizQuestions.push(q);
                    }
                }
            }

            if (quizQuestions.length === 0) {
                notify('No se pudieron generar preguntas validas');
                return;
            }

            renderQuiz();
            notify(`${quizQuestions.length} preguntas generadas`);
        }

        function makeFalseStatement(fact) {
            let statement = fact.fullSentence;
            const originalValue = fact.value;

            // Strategy 1: Change a number
            const numMatch = statement.match(/\b(\d+)\b/);
            if (numMatch) {
                const n = parseInt(numMatch[1]);
                let newNum;
                if (n <= 2) newNum = n + Math.floor(Math.random() * 5) + 3;
                else if (n < 10) newNum = n + (Math.random() > 0.5 ? 2 : -2);
                else newNum = n + Math.floor(Math.random() * 10) + 5;
                if (newNum < 1) newNum = 2;
                statement = statement.replace(numMatch[0], String(newNum));
                if (statement !== fact.fullSentence) return statement.replace(/[.]$/, '');
            }

            // Strategy 2: Negate
            const negations = [
                [/\b(es)\b/, 'no es'], [/\b(son)\b/, 'no son'],
                [/\b(tiene)\b/, 'no tiene'], [/\b(contiene)\b/, 'no contiene'],
                [/\b(concentra)\b/, 'no concentra'], [/\b(forma)\b/, 'no forma'],
                [/\b(puede)\b/, 'no puede'], [/\b(debe)\b/, 'no debe']
            ];
            for (const [pattern, replacement] of negations) {
                if (pattern.test(statement)) {
                    return statement.replace(pattern, replacement).replace(/[.]$/, '');
                }
            }

            // Strategy 3: Swap a key word with plausible opposite
            const swaps = [
                ['mayor', 'menor'], ['menor', 'mayor'],
                ['interno', 'externo'], ['externo', 'interno'],
                ['sol', 'Tierra'], ['Tierra', 'Sol'],
                ['planetas', 'asteroides'], ['asteroides', 'planetas'],
                ['gravedad', 'magnetismo'], ['magnetismo', 'fuerza nuclear']
            ];
            for (const [from, to] of swaps) {
                const regex = new RegExp('\\b' + from + '\\b', 'i');
                if (regex.test(statement)) {
                    return statement.replace(regex, to).replace(/[.]$/, '');
                }
            }

            // Strategy 4: If nothing worked, just prepend "No es cierto que"
            return statement.replace(/[.]$/, '');
        }

        function renderQuiz() {
            const area = document.getElementById('quiz-area');
            area.innerHTML = '';

            quizQuestions.forEach((q, i) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.innerHTML = `
                    <div class="q-header">
                        <span class="q-number">${i + 1}</span>
                        <span class="q-text">${esc(q.question)}</span>
                        <button class="listen-btn" onclick="event.stopPropagation(); speak(\`${q.question.replace(/`/g, "'").replace(/\\/g, '')}\`)">&#127908;</button>
                    </div>
                    <div class="options">
                        ${q.options.map((opt, j) => `
                            <div class="option" data-q="${i}" data-opt="${j}" onclick="selectOption(this, ${i}, ${j})">
                                <input type="radio" name="q${i}" id="q${i}o${j}">
                                <span><strong>${String.fromCharCode(65 + j)}.</strong> ${esc(opt)}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="explanation" id="exp-${i}">${esc(q.explanation || '')}</div>
                `;
                area.appendChild(card);
            });

            document.getElementById('check-area').classList.remove('hidden');
        }

        function selectOption(el, qIdx) {
            document.querySelectorAll(`[data-q="${qIdx}"]`).forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
            el.querySelector('input').checked = true;
        }

        function checkAnswers() {
            let correct = 0;
            quizQuestions.forEach((q, i) => {
                const options = document.querySelectorAll(`[data-q="${i}"]`);
                const selected = document.querySelector(`input[name="q${i}"]:checked`);

                options.forEach((opt, j) => {
                    opt.classList.remove('selected', 'correct', 'incorrect');
                    opt.style.pointerEvents = 'none';

                    if (j === q.correct) {
                        // Always mark the correct answer green
                        opt.classList.add('correct');
                    } else if (selected && parseInt(opt.dataset.opt) === parseInt(selected.value)) {
                        // Mark the wrong selected answer red
                        opt.classList.add('incorrect');
                    }
                });

                if (selected && parseInt(selected.value) === q.correct) correct++;
                document.getElementById(`exp-${i}`).classList.add('show');
            });

            document.getElementById('quiz-score').textContent = `${correct}/${quizQuestions.length}`;
            document.getElementById('quiz-results').style.display = 'block';
            document.getElementById('check-area').classList.add('hidden');
        }

        function resetQuiz() {
            document.getElementById('quiz-area').innerHTML = '';
            document.getElementById('quiz-results').style.display = 'none';
            document.getElementById('check-area').classList.add('hidden');
            quizQuestions = [];
        }

        function openConfig() {
            document.getElementById('api-key-input').value = apiKey;
            document.getElementById('config-modal').classList.add('show');
        }
        function closeConfig() { document.getElementById('config-modal').classList.remove('show'); }
        function saveConfig() {
            apiKey = document.getElementById('api-key-input').value.trim();
            localStorage.setItem('gemini_api_key', apiKey);
            updateApiStatus();
            closeConfig();
            notify(apiKey ? 'API key guardada' : 'API key eliminada');
        }
        function updateApiStatus() {
            const el = document.getElementById('api-status');
            if (apiKey) { el.textContent = 'Gemini OK'; el.className = 'api-status connected'; }
            else { el.textContent = 'Sin API'; el.className = 'api-status disconnected'; }
        }
        function notify(msg) {
            const el = document.getElementById('notification');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3500);
        }

        window.addEventListener('resize', () => { if (pdfDoc) renderPage(currentPage); });
    </script>
</body>
</html>
