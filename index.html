<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudiar</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #a78bfa;
            --primary-light: #c4b5fd;
            --primary-dark: #7c3aed;
            --bg: #0f0f14;
            --card: #1a1a24;
            --card-hover: #22222e;
            --text: #e8e6f0;
            --text-light: #9590a8;
            --border: #2a2a38;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        header {
            background: #1a1a24;
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .config-btn {
            background: var(--border);
            border: 1px solid #3a3a4a;
            color: var(--text);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s;
        }
        .config-btn:hover { background: #3a3a4a; }
        .container { max-width: 900px; margin: 0 auto; padding: 1.5rem; }

        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 5rem 2rem;
            text-align: center;
            background: var(--card);
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 1.5rem;
        }
        .upload-zone:hover, .upload-zone.dragover { border-color: var(--primary); background: var(--card-hover); }
        .upload-zone .icon { font-size: 3rem; margin-bottom: 1rem; }
        .upload-zone h3 { color: var(--primary-light); margin-bottom: 0.5rem; }
        .upload-zone p { color: var(--text-light); font-size: 0.9rem; }
        .upload-zone input { display: none; }

        .tabs {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 1rem;
            background: var(--card);
            padding: 0.3rem;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .tab {
            flex: 1;
            padding: 0.7rem 1rem;
            border: none;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-light);
            transition: all 0.2s;
        }
        .tab.active { background: var(--primary-dark); color: white; }
        .tab:hover:not(.active) { background: var(--card-hover); }
        .panel { display: none; }
        .panel.active { display: block; }

        .pdf-viewer {
            background: var(--card);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            margin-bottom: 1.5rem;
        }
        .pdf-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            background: #12121a;
            border-bottom: 1px solid var(--border);
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .pdf-controls button {
            background: var(--primary-dark);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .pdf-controls button:hover { background: var(--primary); }
        .pdf-controls button:disabled { opacity: 0.3; cursor: not-allowed; }
        .pdf-controls .page-jump {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.85rem;
            color: var(--text-light);
        }
        .pdf-controls .page-jump input {
            width: 50px;
            padding: 0.35rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            text-align: center;
            font-size: 0.85rem;
            background: var(--bg);
            color: var(--text);
        }

        #pdf-container {
            padding: 1rem;
            text-align: center;
            background: #0a0a0f;
        }
        #pdf-container canvas {
            max-width: 100%;
            box-shadow: 0 2px 16px rgba(0,0,0,0.5);
            border-radius: 4px;
        }

        .extracted-text {
            padding: 1.5rem;
            line-height: 2;
            font-size: 0.95rem;
            user-select: text;
            cursor: text;
            border-top: 1px solid var(--border);
            background: #12121a;
        }
        .extracted-text .text-heading {
            color: var(--primary-light);
            font-size: 1.1rem;
            font-weight: 700;
            margin: 1.5rem 0 0.5rem;
        }
        .extracted-text .text-heading:first-child { margin-top: 0; }
        .extracted-text .text-subheading {
            color: var(--primary);
            font-size: 1rem;
            font-weight: 600;
            margin: 1rem 0 0.4rem;
        }
        .extracted-text .text-paragraph {
            margin-bottom: 1rem;
            padding: 0.3rem 0.5rem;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .extracted-text .text-paragraph:hover { background: var(--card-hover); }

        .voice-controls {
            display: flex;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            background: #12121a;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
            align-items: center;
        }
        .voice-btn {
            background: var(--success);
            color: #0f0f14;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .voice-btn:hover { filter: brightness(1.15); }
        .voice-btn.stop { background: var(--danger); color: white; }
        .voice-btn.pause { background: var(--warning); color: #0f0f14; }
        .voice-settings {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-left: auto;
            flex-wrap: wrap;
        }
        .voice-settings label { font-size: 0.8rem; color: var(--text-light); }
        .voice-settings select, .voice-settings input[type="range"] {
            font-size: 0.8rem;
            padding: 0.3rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
        }

        .quiz-section {
            background: var(--card);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 1.5rem;
        }
        .quiz-config {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            align-items: end;
        }
        .quiz-config .field { flex: 1; min-width: 110px; }
        .quiz-config label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-light);
            margin-bottom: 0.3rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .quiz-config input, .quiz-config select {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            background: var(--bg);
            color: var(--text);
        }
        .quiz-config input:focus, .quiz-config select:focus { outline: none; border-color: var(--primary); }
        .generate-btn {
            background: var(--primary-dark);
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .generate-btn:hover { background: var(--primary); }

        .loading { display: none; text-align: center; padding: 3rem; }
        .loading.show { display: block; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .question-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1rem;
        }
        .question-card:hover { border-color: var(--primary-dark); }
        .question-card .q-header {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            margin-bottom: 0.75rem;
        }
        .question-card .q-number {
            background: var(--primary-dark);
            color: white;
            min-width: 28px; height: 28px;
            border-radius: 50%;
            text-align: center;
            line-height: 28px;
            font-size: 0.8rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .question-card .q-text {
            font-weight: 600;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .question-card .listen-btn {
            background: none;
            border: 1px solid var(--primary-dark);
            color: var(--primary-light);
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.7rem;
            margin-left: auto;
            flex-shrink: 0;
        }
        .question-card .listen-btn:hover { background: var(--card-hover); }
        .question-card .options { margin-top: 0.5rem; }
        .question-card .option {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            padding: 0.65rem 0.8rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 0.4rem;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .question-card .option:hover { background: var(--card-hover); border-color: var(--primary-dark); }
        .question-card .option.selected { background: rgba(124,58,237,0.15); border-color: var(--primary); }
        .question-card .option.correct { background: rgba(52,211,153,0.12); border-color: var(--success); color: var(--success); }
        .question-card .option.incorrect { background: rgba(248,113,113,0.12); border-color: var(--danger); color: var(--danger); }
        .question-card .option input { display: none; }
        .question-card .explanation {
            margin-top: 0.75rem;
            padding: 0.75rem;
            background: rgba(251,191,36,0.06);
            border: 1px solid rgba(251,191,36,0.2);
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--warning);
            line-height: 1.5;
            display: none;
        }
        .question-card .explanation.show { display: block; }

        .quiz-results {
            display: none;
            text-align: center;
            padding: 2.5rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-top: 1rem;
        }
        .quiz-results .score { font-size: 3rem; font-weight: 800; color: var(--primary-light); }
        .quiz-results .score-label { font-size: 1rem; color: var(--text-light); margin-top: 0.5rem; }
        .check-btn {
            background: var(--success);
            color: #0f0f14;
            border: none;
            padding: 0.7rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            margin-top: 1.5rem;
        }
        .check-btn:hover { filter: brightness(1.1); }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            max-width: 420px;
            width: 100%;
        }
        .modal h3 { margin-bottom: 0.75rem; color: var(--primary-light); }
        .modal input {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.85rem;
            background: var(--bg);
            color: var(--text);
        }
        .modal .btn-row { display: flex; gap: 0.5rem; margin-top: 1rem; justify-content: flex-end; }
        .modal .btn-row button { padding: 0.5rem 1rem; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
        .modal .btn-row .save-btn { background: var(--primary-dark); color: white; }
        .modal .btn-row .cancel-btn { background: var(--border); color: var(--text); }

        .hidden { display: none !important; }
        .notification {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card);
            color: var(--text);
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            font-size: 0.8rem;
            border: 1px solid var(--border);
            z-index: 300;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .notification.show { opacity: 1; }
        .api-status {
            font-size: 0.65rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
        }
        .api-status.connected { background: rgba(52,211,153,0.15); color: var(--success); }
        .api-status.disconnected { background: rgba(248,113,113,0.15); color: var(--danger); }
        .header-left { display: flex; align-items: center; gap: 0.5rem; }

        @media (max-width: 640px) {
            .container { padding: 1rem; }
            .tabs { flex-direction: column; }
            .tab { font-size: 0.85rem; }
            .pdf-controls { flex-direction: column; align-items: stretch; }
            .quiz-config { flex-direction: column; }
            .quiz-config .field { min-width: 100%; }
            .voice-controls { flex-direction: column; align-items: stretch; }
            .voice-settings { margin-left: 0; justify-content: space-between; }
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <span id="api-status" class="api-status disconnected">Sin API</span>
        </div>
        <button class="config-btn" onclick="openConfig()">API Key</button>
    </header>

    <div class="container">
        <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()">
            <div class="icon">&#128211;</div>
            <h3>Sube tu PDF de estudio</h3>
            <p>Arrastra un archivo aqui o haz clic para seleccionar</p>
            <input type="file" id="file-input" accept=".pdf">
        </div>

        <div class="tabs hidden" id="main-tabs">
            <button class="tab active" data-tab="reader" onclick="switchTab('reader')">Lector de Voz</button>
            <button class="tab" data-tab="quiz" onclick="switchTab('quiz')">Generar Preguntas</button>
        </div>

        <div class="panel active" id="panel-reader">
            <div class="pdf-viewer">
                <div class="pdf-controls">
                    <button onclick="prevPage()" id="btn-prev">&#9664; Anterior</button>
                    <div class="page-jump">
                        <span>Pagina</span>
                        <input type="number" id="page-input" min="1" value="1" onchange="goToPage(this.value)">
                        <span>de <span id="total-pages">0</span></span>
                    </div>
                    <button onclick="nextPage()" id="btn-next">Siguiente &#9654;</button>
                </div>
                <div id="pdf-container"></div>
                <div id="extracted-text" class="hidden"></div>
                <div class="voice-controls">
                    <button class="voice-btn" onclick="speakSelected()" id="btn-speak">&#127908; Leer seleccion</button>
                    <button class="voice-btn pause" onclick="pauseSpeech()" id="btn-pause" disabled>&#9208; Pausar</button>
                    <button class="voice-btn stop" onclick="stopSpeech()" id="btn-stop" disabled>&#9632; Detener</button>
                    <div class="voice-settings">
                        <label>Velocidad:</label>
                        <input type="range" id="speech-rate" min="0.5" max="2" step="0.1" value="1" style="width:70px">
                        <label>Voz:</label>
                        <select id="voice-select"></select>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel" id="panel-quiz">
            <div class="quiz-section">
                <div class="quiz-config">
                    <div class="field">
                        <label>Desde pagina</label>
                        <input type="number" id="quiz-start" min="1" value="1">
                    </div>
                    <div class="field">
                        <label>Hasta pagina</label>
                        <input type="number" id="quiz-end" min="1" value="5">
                    </div>
                    <div class="field">
                        <label>Preguntas</label>
                        <input type="number" id="quiz-count" min="1" max="20" value="5">
                    </div>
                    <div class="field">
                        <label>Tipo</label>
                        <select id="quiz-type">
                            <option value="multiple">Multiple opcion</option>
                            <option value="verdadero">Verdadero / Falso</option>
                            <option value="mezcla">Mezcla</option>
                        </select>
                    </div>
                    <button class="generate-btn" onclick="generateQuiz()" id="btn-generate">Generar</button>
                </div>

                <div class="loading" id="quiz-loading">
                    <div class="spinner"></div>
                    <p style="color:var(--text-light);">Analizando el contenido y generando preguntas...</p>
                </div>

                <div id="quiz-area"></div>
                <div class="quiz-results" id="quiz-results">
                    <div class="score" id="quiz-score">0/0</div>
                    <div class="score-label">Preguntas correctas</div>
                    <button class="check-btn" onclick="resetQuiz()">Volver a intentar</button>
                </div>
                <div class="hidden" id="check-area" style="text-align:center;margin-top:1.5rem;">
                    <button class="check-btn" onclick="checkAnswers()">Verificar respuestas</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="config-modal">
        <div class="modal">
            <h3>Configuracion API</h3>
            <p style="font-size:0.8rem;color:var(--text-light);margin-bottom:0.75rem;">
                API key de Google Gemini para preguntas inteligentes.
                <br><a href="https://aistudio.google.com/apikey" target="_blank" style="color:var(--primary-light);">Obtener API key gratis</a>
            </p>
            <input type="password" id="api-key-input" placeholder="Pega tu API key aqui...">
            <div class="btn-row">
                <button class="cancel-btn" onclick="closeConfig()">Cancelar</button>
                <button class="save-btn" onclick="saveConfig()">Guardar</button>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfDoc = null;
        let currentPage = 1;
        let totalPages = 0;
        let allPageText = {};
        let allPageLines = {};
        let apiKey = localStorage.getItem('gemini_api_key') || 'AIzaSyBIHCO5RhEv6VeoOZERi3ynvvet1hEuS5A';
        let quizQuestions = [];

        const uploadZone = document.getElementById('upload-zone');
        const fileInput = document.getElementById('file-input');
        const pdfContainer = document.getElementById('pdf-container');
        const extractedTextEl = document.getElementById('extracted-text');

        updateApiStatus();

        fileInput.addEventListener('change', e => { if (e.target.files[0]) loadPDF(e.target.files[0]); });
        uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
        uploadZone.addEventListener('drop', e => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            if (e.dataTransfer.files[0]) loadPDF(e.dataTransfer.files[0]);
        });

        async function loadPDF(file) {
            const arrayBuffer = await file.arrayBuffer();
            pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            totalPages = pdfDoc.numPages;
            currentPage = 1;

            document.getElementById('total-pages').textContent = totalPages;
            document.getElementById('page-input').max = totalPages;
            document.getElementById('quiz-end').max = totalPages;
            document.getElementById('quiz-end').value = Math.min(5, totalPages);
            document.getElementById('main-tabs').classList.remove('hidden');
            uploadZone.innerHTML = `<div class="icon">&#9989;</div><h3>${file.name}</h3><p>${totalPages} paginas listas</p>`;
            uploadZone.style.cursor = 'default';
            uploadZone.onclick = null;

            await extractAllText();
            renderPage(currentPage);
            notify('PDF cargado');
        }

        async function extractAllText() {
            allPageText = {};
            allPageLines = {};

            for (let i = 1; i <= totalPages; i++) {
                const page = await pdfDoc.getPage(i);
                const textContent = await page.getTextContent();
                const items = textContent.items;

                if (items.length === 0) {
                    allPageText[i] = '';
                    allPageLines[i] = [];
                    continue;
                }

                const lines = [];
                let currentLine = { text: '', y: items[0].y, items: [] };

                for (const item of items) {
                    const itemY = item.y;

                    if (Math.abs(itemY - currentLine.y) > 3) {
                        if (currentLine.text.trim()) {
                            lines.push(currentLine.text.trim());
                        }
                        currentLine = { text: item.str, y: itemY, items: [item] };
                    } else {
                        const lastChar = currentLine.text.slice(-1);
                        const needsSpace = lastChar && lastChar !== ' ' && lastChar !== '\n' && item.str && !item.str.startsWith(' ');
                        currentLine.text += (needsSpace ? ' ' : '') + item.str;
                        currentLine.items.push(item);
                    }
                }
                if (currentLine.text.trim()) lines.push(currentLine.text.trim());

                const sortedByY = [...lines];

                const paragraphGroups = [];
                let currentGroup = [];

                for (let j = 0; j < sortedByY.length; j++) {
                    const line = sortedByY[j];
                    currentGroup.push(line);

                    const isTitle = line.length < 80 && !line.endsWith('.') && !line.endsWith(',') && j < sortedByY.length - 1;
                    const nextLine = sortedByY[j + 1];
                    const gapLarge = nextLine && Math.abs(getLineY(items, line) - getLineY(items, nextLine)) > 20;

                    if (gapLarge || (isTitle && currentGroup.length >= 1)) {
                        paragraphGroups.push(currentGroup.join(' '));
                        currentGroup = [];
                    }
                }
                if (currentGroup.length > 0) {
                    paragraphGroups.push(currentGroup.join(' '));
                }

                allPageLines[i] = lines;
                allPageText[i] = paragraphGroups.join('\n\n');
            }
        }

        function getLineY(items, lineText) {
            for (const item of items) {
                if (item.str.trim() && lineText.includes(item.str.trim())) return item.y;
            }
            return 0;
        }

        async function renderPage(num) {
            const page = await pdfDoc.getPage(num);
            const containerWidth = pdfContainer.clientWidth - 32;
            const unscaledViewport = page.getViewport({ scale: 1 });
            const scale = Math.min(containerWidth / unscaledViewport.width, 2);
            const viewport = page.getViewport({ scale });

            pdfContainer.innerHTML = '';
            const canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            pdfContainer.appendChild(canvas);

            await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

            document.getElementById('page-input').value = num;
            document.getElementById('btn-prev').disabled = num <= 1;
            document.getElementById('btn-next').disabled = num >= totalPages;

            showExtractedText(num);
        }

        function showExtractedText(num) {
            const lines = allPageLines[num] || [];
            const fullText = allPageText[num] || '';

            if (lines.length === 0) {
                extractedTextEl.innerHTML = '<p style="color:var(--text-light);">No se pudo extraer texto de esta pagina.</p>';
                extractedTextEl.classList.remove('hidden');
                return;
            }

            const paragraphs = fullText.split('\n\n');
            let html = '';

            for (const para of paragraphs) {
                const trimmed = para.trim();
                if (!trimmed) continue;

                const isShortTitle = trimmed.length < 80 && !trimmed.endsWith('.') && !trimmed.endsWith(',');

                if (isShortTitle) {
                    html += `<div class="text-heading">${trimmed}</div>`;
                } else if (trimmed.length < 120) {
                    html += `<div class="text-subheading">${trimmed}</div>`;
                } else {
                    html += `<div class="text-paragraph">${trimmed}</div>`;
                }
            }

            extractedTextEl.innerHTML = html;
            extractedTextEl.classList.remove('hidden');
        }

        function prevPage() { if (currentPage > 1) { currentPage--; renderPage(currentPage); } }
        function nextPage() { if (currentPage < totalPages) { currentPage++; renderPage(currentPage); } }
        function goToPage(val) {
            const p = parseInt(val);
            if (p >= 1 && p <= totalPages) { currentPage = p; renderPage(currentPage); }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById(`panel-${tab}`).classList.add('active');
        }

        // Speech
        function speakSelected() {
            const sel = window.getSelection().toString().trim();
            speak(sel || extractedTextEl.innerText);
        }
        function speak(text) {
            stopSpeech();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'es-ES';
            u.rate = parseFloat(document.getElementById('speech-rate').value);
            const vs = document.getElementById('voice-select');
            if (vs.value) u.voice = speechSynthesis.getVoices()[parseInt(vs.value)];
            u.onstart = () => { document.getElementById('btn-speak').disabled = true; document.getElementById('btn-pause').disabled = false; document.getElementById('btn-stop').disabled = false; };
            u.onend = () => { document.getElementById('btn-speak').disabled = false; document.getElementById('btn-pause').disabled = true; document.getElementById('btn-stop').disabled = true; };
            speechSynthesis.speak(u);
        }
        function pauseSpeech() { if (speechSynthesis.speaking) speechSynthesis.paused ? speechSynthesis.resume() : speechSynthesis.pause(); }
        function stopSpeech() {
            speechSynthesis.cancel();
            document.getElementById('btn-speak').disabled = false;
            document.getElementById('btn-pause').disabled = true;
            document.getElementById('btn-stop').disabled = true;
        }
        function loadVoices() {
            const voices = speechSynthesis.getVoices();
            const select = document.getElementById('voice-select');
            select.innerHTML = '';
            const esVoices = voices.filter(v => v.lang.startsWith('es'));
            (esVoices.length > 0 ? esVoices : voices).forEach(v => {
                const opt = document.createElement('option');
                opt.value = voices.indexOf(v);
                opt.textContent = `${v.name} (${v.lang})`;
                select.appendChild(opt);
            });
        }
        speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        // Quiz
        async function generateQuiz() {
            const start = parseInt(document.getElementById('quiz-start').value);
            const end = parseInt(document.getElementById('quiz-end').value);
            const count = parseInt(document.getElementById('quiz-count').value);
            const type = document.getElementById('quiz-type').value;

            if (start < 1 || end > totalPages || start > end) { notify('Rango invalido'); return; }
            if (count < 1 || count > 20) { notify('Numero de preguntas invalido'); return; }

            let content = '';
            for (let i = start; i <= end; i++) {
                const pageText = allPageText[i] || '';
                if (pageText.trim()) {
                    content += `\n\n=== CONTENIDO DE LA PAGINA ${i} ===\n${pageText}`;
                }
            }

            content = content.trim();
            if (!content) { notify('No hay texto en esas paginas'); return; }

            if (!apiKey) { generateOfflineQuiz(content, count, type); return; }

            document.getElementById('quiz-loading').classList.add('show');
            document.getElementById('quiz-area').innerHTML = '';
            document.getElementById('quiz-results').style.display = 'none';
            document.getElementById('check-area').classList.add('hidden');

            try {
                const prompt = `Eres un profesor universitario experto en cosmetologia. Genera EXACTAMENTE ${count} preguntas de examen basandote en el siguiente contenido de un libro.

CONTENIDO DEL LIBRO:
${content.substring(0, 15000)}

INSTRUCCIONES ESTRICTAS:

1. Lee TODO el contenido cuidadosamente antes de crear las preguntas.

2. Cada pregunta debe referirse a un CONCEPTO ESPECIFICO del texto. Ejemples de BUENAS preguntas:
   - "Que es el Sistema Solar?" (requiere definir)
   - "Cuantos planetas tiene el Sistema Solar?" (requiere un numero especifico)
   - "Que tipo de estrella es el Sol?" (requiere clasificar)
   - "Que fuerza mantiene a los objetos orbitando al Sol?" (requiere identificar un concepto)

3. NUNCA hagas preguntas como "Segun el texto, cual es correcta?" con opciones que sean fragmentos copiados del texto. Eso es un formato MALO.

4. Las opciones incorrectas deben ser respuestas plausibles del mismo tema, NO fragmentos random del texto ni "Informacion no disponible".

5. El campo "correct" es el INDICE (empezando en 0) de la opcion correcta en el array "options".

6. Cada explicacion debe mencionar que dice el texto sobre ese tema.

7. Formato de pregunta tipo multiple:
   - 4 opciones (A, B, C, D)
   - Solo 1 correcta
   - Opciones cortas y claras (max 60 caracteres cada una)

8. Formato de pregunta tipo V/F:
   - 2 opciones: "Verdadero" y "Falso"
   - El campo correct es 0 (verdadero) o 1 (falso)
   - La afirmacion debe ser clara y basada en el texto

TIPO DE PREGUNTA: ${type === 'multiple' ? 'TODAS deben ser multiple opcion con 4 alternativas' : type === 'verdadero' ? 'TODAS deben ser Verdadero/Falso' : 'MEZCLA: mitad multiple, mitad V/F'}

RESPONDE SOLO CON JSON VALIDO, nada mas. Sin markdown, sin explicaciones antes o despues.

JSON:
{"questions":[{"question":"texto de la pregunta","options":["A","B","C","D"],"correct":0,"explanation":"explicacion basada en el texto"}]}`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { temperature: 0.2, maxOutputTokens: 8192 }
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || 'Error API');

                const rawText = data.candidates[0].content.parts[0].text;
                const jsonMatch = rawText.match(/\{[\s\S]*\}/);
                if (!jsonMatch) throw new Error('JSON no encontrado en la respuesta');

                const parsed = JSON.parse(jsonMatch[0]);

                if (!parsed.questions || !Array.isArray(parsed.questions) || parsed.questions.length === 0) {
                    throw new Error('El JSON no tiene el formato esperado');
                }

                quizQuestions = parsed.questions;
                renderQuiz();
                notify(`${quizQuestions.length} preguntas generadas`);

            } catch (err) {
                console.error('Error Gemini:', err);
                notify('Error con API. Usando modo offline...');
                generateOfflineQuiz(content, count, type);
            } finally {
                document.getElementById('quiz-loading').classList.remove('show');
            }
        }

        function generateOfflineQuiz(content, count, type) {
            const paragraphs = content.split(/\n\n+/).filter(p => p.trim().length > 30);
            quizQuestions = [];

            const shuffled = [...paragraphs].sort(() => Math.random() - 0.5);

            for (let i = 0; i < Math.min(count, shuffled.length); i++) {
                const para = shuffled[i].replace(/===.*===/g, '').trim();
                const sentences = para.split(/[.!?]+/).filter(s => s.trim().length > 15);
                if (sentences.length === 0) continue;

                const keySentence = sentences[0].trim();

                if (type === 'verdadero' || (type === 'mezcla' && Math.random() > 0.5)) {
                    const isTrue = Math.random() > 0.35;
                    quizQuestions.push({
                        question: keySentence + (isTrue ? '.' : ' (esto es falso).'),
                        options: ['Verdadero', 'Falso'],
                        correct: isTrue ? 0 : 1,
                        explanation: isTrue ? 'Esta informacion se encuentra en el texto del libro.' : 'Esta afirmacion es incorrecta segun el texto.'
                    });
                } else {
                    const otherParas = shuffled.filter((_, j) => j !== i).slice(0, 3);
                    const correctAnswer = keySentence.length > 60 ? keySentence.substring(0, 57) + '...' : keySentence;
                    const options = [correctAnswer];

                    for (const other of otherParas) {
                        const clean = other.replace(/===.*===/g, '').trim();
                        const sents = clean.split(/[.!?]+/).filter(s => s.trim().length > 15);
                        if (sents.length > 0) {
                            let opt = sents[0].trim();
                            if (opt.length > 60) opt = opt.substring(0, 57) + '...';
                            if (!options.includes(opt)) options.push(opt);
                        }
                    }

                    while (options.length < 4) options.push('Opcion no disponible');

                    const shuffledOpts = [...options].sort(() => Math.random() - 0.5);
                    const correctIdx = shuffledOpts.indexOf(options[0]);

                    quizQuestions.push({
                        question: 'Cual de las siguientes afirmaciones es correcta segun el texto?',
                        options: shuffledOpts,
                        correct: correctIdx,
                        explanation: 'La respuesta correcta se encuentra en el texto del libro.'
                    });
                }
            }

            if (quizQuestions.length === 0) {
                notify('No se pudieron generar preguntas');
                return;
            }

            renderQuiz();
            notify(`${quizQuestions.length} preguntas generadas (offline)`);
        }

        function renderQuiz() {
            const area = document.getElementById('quiz-area');
            area.innerHTML = '';

            quizQuestions.forEach((q, i) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.innerHTML = `
                    <div class="q-header">
                        <span class="q-number">${i + 1}</span>
                        <span class="q-text">${escapeHtml(q.question)}</span>
                        <button class="listen-btn" onclick="event.stopPropagation(); speak(\`${escapeForSpeak(q.question)}\`)">&#127908;</button>
                    </div>
                    <div class="options">
                        ${q.options.map((opt, j) => `
                            <div class="option" data-q="${i}" data-opt="${j}" onclick="selectOption(this, ${i}, ${j})">
                                <input type="radio" name="q${i}" id="q${i}o${j}">
                                <span><strong>${String.fromCharCode(65 + j)}.</strong> ${escapeHtml(opt)}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="explanation" id="exp-${i}">${escapeHtml(q.explanation || '')}</div>
                `;
                area.appendChild(card);
            });

            document.getElementById('check-area').classList.remove('hidden');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function escapeForSpeak(str) {
            return str.replace(/`/g, "'").replace(/\\/g, '');
        }

        function selectOption(el, qIdx) {
            document.querySelectorAll(`[data-q="${qIdx}"]`).forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
            el.querySelector('input').checked = true;
        }

        function checkAnswers() {
            let correct = 0;
            quizQuestions.forEach((q, i) => {
                const options = document.querySelectorAll(`[data-q="${i}"]`);
                const selected = document.querySelector(`input[name="q${i}"]:checked`);

                options.forEach((opt, j) => {
                    opt.classList.remove('selected', 'correct', 'incorrect');
                    opt.style.pointerEvents = 'none';
                    if (j === q.correct) opt.classList.add('correct');
                    if (selected && parseInt(opt.dataset.opt) === parseInt(selected.value) && j !== q.correct) {
                        opt.classList.add('incorrect');
                    }
                });

                if (selected && parseInt(selected.value) === q.correct) correct++;
                document.getElementById(`exp-${i}`).classList.add('show');
            });

            document.getElementById('quiz-score').textContent = `${correct}/${quizQuestions.length}`;
            document.getElementById('quiz-results').style.display = 'block';
            document.getElementById('check-area').classList.add('hidden');
        }

        function resetQuiz() {
            document.getElementById('quiz-area').innerHTML = '';
            document.getElementById('quiz-results').style.display = 'none';
            document.getElementById('check-area').classList.add('hidden');
            quizQuestions = [];
        }

        // Config
        function openConfig() {
            document.getElementById('api-key-input').value = apiKey;
            document.getElementById('config-modal').classList.add('show');
        }
        function closeConfig() { document.getElementById('config-modal').classList.remove('show'); }
        function saveConfig() {
            apiKey = document.getElementById('api-key-input').value.trim();
            localStorage.setItem('gemini_api_key', apiKey);
            updateApiStatus();
            closeConfig();
            notify(apiKey ? 'API key guardada' : 'API key eliminada');
        }
        function updateApiStatus() {
            const el = document.getElementById('api-status');
            if (apiKey) { el.textContent = 'Gemini OK'; el.className = 'api-status connected'; }
            else { el.textContent = 'Modo offline'; el.className = 'api-status disconnected'; }
        }
        function notify(msg) {
            const el = document.getElementById('notification');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        window.addEventListener('resize', () => { if (pdfDoc) renderPage(currentPage); });
    </script>
</body>
</html>
